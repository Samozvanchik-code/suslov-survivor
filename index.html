<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #1a1820; overflow: hidden;
    font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  canvas {
    display: block; width: 100%; height: 100%; cursor: default;
    touch-action: none;              /* иначе страница будет скроллиться под пальцем */
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
  }
  html, body { touch-action: none; overscroll-behavior: none; }

  /* Поле ника: канвас текст не принимает, нужен настоящий input */
  #ник {
    position: absolute; left: 50%; transform: translateX(-50%);
    display: none; z-index: 10;
    width: 260px; padding: 11px 14px;
    border-radius: 10px; text-align: center;
    background: rgba(32, 30, 43, 0.9);
    border: 1px solid rgba(220, 215, 235, 0.28);
    color: #f2f0f6; outline: none;
    font: 700 18px system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  }
  #ник::placeholder { color: #7d7890; font-weight: 600; }
  #ник:focus { border-color: #8fb6ff; background: rgba(44, 42, 60, 0.95); }
  #fb {
    position: absolute; left: 50%; transform: translateX(-50%);
    display: none; z-index: 10;
    padding: 9px 18px; border-radius: 10px;
    background: rgba(32, 30, 43, 0.82);
    border: 1px solid rgba(220, 215, 235, 0.22);
    color: #cfc9dd; text-decoration: none;
    font: 600 15px system-ui, "Segoe UI", Roboto, Arial, sans-serif;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  #fb:hover {
    background: rgba(60, 79, 134, 0.9);
    border-color: #8fb6ff;
    color: #f2f0f6;
  }
</style>
</head>
<body>
<canvas id="экран"></canvas>
<!-- Обычный HTML поверх канваса: нарисованная в канвасе кнопка не кликабельна.
     Показывается только на экранах ПОДРУБ и ИТОГИ, в бою скрыта, чтобы не ловила клики. -->
<a id="fb" href="https://t.me/ichrir" target="_blank" rel="noopener noreferrer">Есть идея или нашёл баг → @ichrir</a>
<input id="ник" maxlength="14" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="твой ник">
<script>
"use strict";

/* ==========================================================================
   СУСЛОВ: ВЫЖИВАЧ
   Этап 2: гантеля-бумеранг, кристаллы опыта, левелап, выбор из 3 карточек.
   Этап 1 переписан под новый рендер: полное разрешение, настоящие спрайты,
   процедурная анимация.

   Весь контент лежит в конфигах этого блока. Новый враг или апгрейд —
   одна строчка тут, логику трогать не надо.
   ========================================================================== */


/* ==========================================================================
   БЛОК 0. КОНФИГИ
   ========================================================================== */

// --- Спрайты. Пути относительные: index.html лежит рядом с папкой sprites. ---
const МАНИФЕСТ = {

  anon_zhirniy:     { файл: 'sprites/anon_zhirniy.png',     ш: 120, в: 176 },

// Спрайты нарочно крупные, в игре масштабируются вниз. Один общий множитель

// что и даёт заявленный в ТЗ хитбокс 34x64.
const МАСШТАБ_МИРА = 0.55;

const ЦВЕТ = {

  полТёмный:  '#222029',
  крапина:    '#332f3c',

  текст:      '#f2f0f6',

  опыт:       '#49c7ff',
  опытФон:    '#16303f',
  золото:     '#ffcc44',
  зелёный:    '#5ce08a',

  крик:       '#8fd8ff',
  урон:       '#ff6060'
};

// --- Главный герой ---
const ГЕРОЙ = {
  hp: 3,
  скорость: 240,          // px/сек, «ножки-спички» — самый быстрый и самый хрупкий
  хитбоксШ: 34,

};

// --- Базовое оружие: ГАНТЕЛЯ-бумеранг. Пять уровней прокачки. ---
const ГАНТЕЛЯ = {
  перезарядка: 1.4,
  уровни: [
    { дальность: 260, урон: 6,  штук: 1, возвратX: 1, разлёт: 0 },
    { дальность: 325, урон: 8,  штук: 1, возвратX: 1, разлёт: 0 },
    { дальность: 325, урон: 8,  штук: 2, возвратX: 1, разлёт: 18 },
    { дальность: 325, урон: 8,  штук: 2, возвратX: 2, разлёт: 18 },
    { дальность: 400, урон: 14, штук: 3, возвратX: 2, разлёт: 18 }
  ],
  скоростьБроска: 520,     // на этой скорости вылетает и равномерно тормозит до нуля

};

const КРИК = {
  перезарядка: 3.0,
  уровни: [
    { радиус: 180, урон: 10, отброс: 260 },
    { радиус: 210, урон: 14, отброс: 300 },
    { радиус: 240, урон: 18, отброс: 340 },
    { радиус: 280, урон: 24, отброс: 380 },

// --- ОТЧЁТ ОТПРАВЛЕН: мгновенно удаляет случайного врага в радиусе ---
const ОТЧЁТ = {
  уровни: [
    { перезарядка: 15, радиус: 400, целей: 1 },
    { перезарядка: 13, радиус: 450, целей: 1 },
    { перезарядка: 11, радиус: 500, целей: 2 },
    { перезарядка: 9,  радиус: 550, целей: 2 },

};

// --- ПРАЙМ: ульта, на время все статы вдвое ---
const ПРАЙМ = {
  уровни: [
    { перезарядка: 45, длительность: 8 },
    { перезарядка: 40, длительность: 9 },
    { перезарядка: 35, длительность: 10 },
    { перезарядка: 30, длительность: 11 },
    { перезарядка: 25, длительность: 12 }
  ]
};

/* --- ВРАГИ. У каждой вариации свой спрайт.
   цена — вес в бюджете угрозы, см. ВОЛНЫ
   пачка — спавнится стаей в одной точке, а не по всей окружности --- */
const ВРАГИ = {
  anon:    { имя:'Анон',       hp:10, скорость:110, урон:1, опыт:2, цена:2,   спрайт:'anon',         масштаб:1.00, ширинаX:1.0, поведение:'преследует' },
  zhirniy: { имя:'Жирный',     hp:40, скорость:62,  урон:2, опыт:5, цена:5,   спрайт:'anon_zhirniy', масштаб:1.00, ширинаX:1.0, поведение:'таранит'    },
  meloch:  { имя:'Мелочь',     hp:4,  скорость:190, урон:1, опыт:1, цена:0.6, спрайт:'anon_meloch',  масштаб:1.00, ширинаX:1.0, поведение:'преследует', пачка:5 },
  drisch:  { имя:'Дрищ',       hp:1,  скорость:320, урон:1, опыт:1, цена:1,   спрайт:'anon_drisch',  масштаб:1.00, ширинаX:1.0, поведение:'преследует' },
  kaming:  { имя:'Каминг-аут', hp:8,  скорость:150, урон:3, опыт:2, цена:2,   спрайт:'anon_kaming',  масштаб:1.00, ширинаX:1.0, поведение:'взрывается', примета:'пульсация' },
  delitel: { имя:'Делитель',   hp:20, скорость:100, урон:1, опыт:2, цена:3,   спрайт:'anon_delitel', масштаб:1.00, ширинаX:1.0, поведение:'делится' },
  maska:   { имя:'Маска',      hp:25, скорость:88,  урон:2, опыт:5, цена:4,   спрайт:'anon_maska',   масштаб:1.00, ширинаX:1.0, поведение:'щит' }
};

// --- Каминг-аут: подбегает вплотную и подрывается ---
const КАМИНГ = {
  дистанцияЗамаха: 70,     // на таком расстоянии начинает замах
  замах: 0.6,              // сек предупреждения: пульсация нарастает, идёт писк
  цепнойЗамах: 0.15,       // соседний каминг в радиусе взрыва детонирует почти сразу
  радиус: 130,
  уронСвоим: 14            // взрыв бьёт и анонов — цепные подрывы в толпе
};

// --- Делитель: при смерти рождает двух мелких ---
const ДЕЛИТЕЛЬ = {
  сколько: 2,
  разлёт: 260,             // скорость разлёта в стороны
  безвредность: 0.3        // сек, пока новорождённые не наносят контактный урон
};

// --- Маска: неуязвима спереди, тыл — сектор 120 градусов ---
const МАСКА = {
  тыловойСектор: 120 * Math.PI / 180
};

/* --- БОССЫ. Уникальные враги: их на экране один-два, поэтому они НЕ идут
   в предрендер поз. ТОЛПА по ходу боя уменьшается, теряя куски, а под
   плавно меняющийся масштаб одна запечённая копия не годится. --- */
const БОССЫ = {
  ТОЛПА: {
    имя:'ТОЛПА', hp:400, скорость:45, урон:4, опыт:100, спрайт:'boss_tolpa',
    масштаб:1.0, ширинаX:1.0, уникальный:true, поведение:'разваливается',
    уронНаКусок:100,        // каждые 100 полученного урона отваливается кусок
    усадка:0.055,           // на столько уменьшается масштаб с каждым куском
    минМасштаб:0.55
  }
};

// Кусок, отвалившийся от ТОЛПЫ: летит по дуге, приземляется и встаёт.
const КУСОК = {
  полёт: 0.75,             // сек до приземления
  высотаДуги: 150,
  разлёт: 260,             // на сколько пикселей отлетает от босса
  вставание: 0.5           // сек: не двигается и не бьёт, но уже уязвим
};

/* Бросок анона в игрока. Убегать от ТОЛПЫ должно быть небесплатно:
   она вдвое медленнее Ильи и иначе просто игнорируется. На эти броски
   босс своих hp не тратит — он сам себе набирает эскорт. */
const БРОСОК = {
  интервал: 4,
  полёт: 1.0,
  высотаДуги: 260,
  урон: 3,
  радиусУрона: 80
};

// Награда за ТОЛПУ: череп плюс жирный сгусток опыта.
const НАГРАДА_БОССА = {
  опыт: 140,               // примерно полтора уровня в середине забега
  кристаллов: 12           // рассыпается веером, чтобы подбор читался как событие
};

// ЧЕРЕП — бутылка абсента. Режим Шварца: риск-награда.
const ЧЕРЕП = {
  длительность: 20,
  урон: 3,                 // множитель
  скорость: 2,
  инерция: 2.6,            // пьяное управление: персонажа заносит
  тикHp: 5                 // раз в столько секунд снимается 1 hp
};

/* --- ВОЛНЫ.
   Волна задаёт не интервал, а БЮДЖЕТ УГРОЗЫ в очках за секунду. Бюджет копится
   каждый кадр, и пока накопленного хватает на цену случайного типа из пула —
   этот тип спавнится. Пачка мелочи из пяти голов стоит пять цен и сама
   съедает свою долю, поэтому больше не захлёстывает экран.

   пул — веса выбора типа, а не количество. Состав меняется со временем:
   в поздних волнах вес дорогих врагов растёт, дешёвых падает. */
const ВОЛНЫ = [
  { t:0,   бюджет:1.4,  пул:{ anon:1 } },
  { t:45,  бюджет:2.2,  пул:{ anon:1 } },                                              // просто больше анонов
  { t:75,  бюджет:2.6,  пул:{ anon:4, meloch:1 } },                                    // мелочь заходит здесь
  { t:90,  бюджет:3.2,  пул:{ anon:4, meloch:2, drisch:1 } },
  { t:150, бюджет:4.5,  пул:{ anon:3, meloch:1, zhirniy:1, delitel:1 } },
  { t:180, босс:'ТОЛПА' },
  { t:210, бюджет:6.0,  пул:{ anon:3, kaming:1, maska:1, meloch:2 } },
  { t:300, босс:'ШВАРЦ' },
  { t:330, бюджет:9.5,  пул:{ anon:3, meloch:2, zhirniy:2, delitel:2, kaming:1, maska:1 } },
  { t:420, босс:'ТОЛПА', множитель_hp:2 },
  { t:480, бюджет:14.0, пул:{ anon:2, meloch:1, zhirniy:3, delitel:2, kaming:2, maska:3 } },
  { t:600, конец:'ПОБЕДА' }
];

const БАЛАНС = {
  // Технический потолок, не игровой. По достижении спавн НЕ останавливается:
  // вытесняем самых дальних за экраном, давление не падает, кадры держатся.
  потолокВрагов: 300,          // на мобильных снижается до 150, см. ниже
  длинаЗабега: 600,
  // Спавн за краем экрана. Считаем в полудиагоналях: 1.0 — ровно угол экрана,

  максБюджетВЗапасе: 20,     // не копим очки бесконечно, пока игрок сидит в паузе

};

/* ==========================================================================

   ========================================================================== */
const ИВЕНТ = {
  интервал: 90,
  времяНаСпасение: 60,
  гарнизонОт: 15, гарнизонДо: 20,

  радиусВзлома: 95,
  времяВзлома: 4,

const ДОНАТЕРЫ = {
  galiopola: {
    ник: 'galiopola', спрайт: 'don_galiopola', топ: true, злее: 2,
    бонус: '+25% опыта навсегда и сразу уровень', иконка: 'мышление',
    применить: (и) => {
      и.множительОпыта += 0.25;
      ИГРА.уровень++;
      // Карточки откладываем: иначе экран левелапа закроет собой
      // праздничный кадр, ради которого весь ивент и затевался.
      ИГРА.очередьЛевелапов++;
      ИГРА.отложенныйЛевелап = Math.max(ИГРА.отложенныйЛевелап, 1.3);
    }
  },
  nishebrodov: {
    ник: 'nishebrodov', спрайт: 'don_nishebrodov',
    бонус: '30 мелких кристаллов по карте', иконка: 'люкс',
    применить: (и) => {
      for (let n = 0; n < 30; n++) {
        const у = случ(0, ДВА_ПИ), r = случ(200, 900);
        уронитьКристалл(и.x + Math.cos(у) * r, и.y + Math.sin(у) * r, 2);
      }
    }
  },

/* ==========================================================================

   Рисуем в логических пикселях (CSS), а буфер держим в физических,
   с учётом devicePixelRatio. Это не ретро-игра с крупным пикселем.
   ========================================================================== */

const случ      = (a, b) => a + Math.random() * (b - a);
const изМассива = (м) => м[Math.floor(Math.random() * м.length)];
const зажать    = (v, a, b) => v < a ? a : (v > b ? b : v);
const дистанция = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

const канвас = document.getElementById('экран');
const кт = канвас.getContext('2d', { alpha: false });

/* Мобильный режим определяем по типу указателя, а не по строке браузера:
   строку подделывают, а coarse-pointer честно говорит, что тыкают пальцем.
   ?mobile=1 в адресе форсирует режим для проверки с настольного браузера. */
const МОБИЛЬНЫЙ = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches)
                  || /[?&]mobile=1/.test(location.search);

const ЭКР = { ш: 800, в: 450, дпр: 1, диагональ: 918, uiМасштаб: 1 };

function пересчитатьРазмер() {
  ЭКР.дпр = Math.min(window.devicePixelRatio || 1, 2);   // выше 2 смысла нет, только жрёт
  // На узком экране интерфейс крупнее: с телефона в руке цифры должны читаться
  ЭКР.uiМасштаб = зажать(1150 / Math.max(ЭКР.ш, 1), 1, 1.85);
  ЭКР.ш = window.innerWidth;
  ЭКР.в = window.innerHeight;
  ЭКР.диагональ = Math.hypot(ЭКР.ш, ЭКР.в);
  канвас.width  = Math.round(ЭКР.ш * ЭКР.дпр);
  канвас.height = Math.round(ЭКР.в * ЭКР.дпр);
  кт.setTransform(ЭКР.дпр, 0, 0, ЭКР.дпр, 0, 0);
  кт.imageSmoothingEnabled = true;
  кт.imageSmoothingQuality = 'high';
}
window.addEventListener('resize', пересчитатьРазмер);
пересчитатьРазмер();


/* ==========================================================================

   ========================================================================== */

const СПРАЙТ = {};                 // ключ -> { картинка, ш, в }
let загружено = 0, всегоЗагрузить = 0, ошибкиЗагрузки = [];

function загрузитьСпрайты(готово) {
  const ключи = Object.keys(МАНИФЕСТ);
  всегоЗагрузить = ключи.length;
  if (всегоЗагрузить === 0) { готово(); return; }

  for (const ключ of ключи) {
    const запись = МАНИФЕСТ[ключ];
    const карт = new Image();
    СПРАЙТ[ключ] = { картинка: карт, ш: запись.ш, в: запись.в, готов: false };
    карт.onload = () => {
      СПРАЙТ[ключ].готов = true;
      // Реальные размеры важнее записанных в манифесте.
      СПРАЙТ[ключ].ш = карт.naturalWidth  || запись.ш;
      СПРАЙТ[ключ].в = карт.naturalHeight || запись.в;
      if (++загружено >= всегоЗагрузить) готово();
    };
    карт.onerror = () => {
      ошибкиЗагрузки.push(запись.файл);
      if (++загружено >= всегоЗагрузить) готово();
    };
    карт.src = запись.файл;
  }
}

/* ==========================================================================
   ТАЧ-ВВОД: плавающий джойстик
   Касание в любом месте создаёт стик там, где палец. Никаких фиксированных
   зон: на телефоне игрок не глядя кладёт палец куда удобно.
   ========================================================================== */
const джойстик = {
  активен: false, ид: null,
  базаX: 0, базаY: 0, x: 0, y: 0,
  дx: 0, дy: 0,
  радиус: 78, мёртваяЗона: 12
};

if (МОБИЛЬНЫЙ) БАЛАНС.потолокВрагов = 150;   // телефон 300 врагов не вывезет

function точкаКасания(t) {
  const r = канвас.getBoundingClientRect();
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}

function пересчитатьДжойстик() {
  const дx = джойстик.x - джойстик.базаX;
  const дy = джойстик.y - джойстик.базаY;
  const д = Math.hypot(дx, дy);
  if (д < джойстик.мёртваяЗона) { джойстик.дx = 0; джойстик.дy = 0; return; }
  джойстик.дx = дx / д;
  джойстик.дy = дy / д;
}

канвас.addEventListener('touchstart', (e) => {
  e.preventDefault();
  разбудитьЗвук();                     // iOS даёт звук только по жесту пользователя
  const t = e.changedTouches[0];
  const п = точкаКасания(t);

  // на экранах меню касание работает как клик по кнопке
  if (ИГРА.экран !== 'бой') { мышь.x = п.x; мышь.y = п.y; мышь.клик = true; return; }

  джойстик.активен = true; джойстик.ид = t.identifier;
  джойстик.базаX = п.x; джойстик.базаY = п.y;
  джойстик.x = п.x; джойстик.y = п.y;
  джойстик.дx = 0; джойстик.дy = 0;
}, { passive: false });

канвас.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (!джойстик.активен) return;
  for (const t of e.changedTouches) {
    if (t.identifier !== джойстик.ид) continue;
    const п = точкаКасания(t);
    джойстик.x = п.x; джойстик.y = п.y;
    // база подтягивается, если палец ушёл дальше радиуса — стик не «залипает»
    const дx = джойстик.x - джойстик.базаX, дy = джойстик.y - джойстик.базаY;
    const д = Math.hypot(дx, дy);
    if (д > джойстик.радиус) {
      джойстик.базаX = джойстик.x - (дx / д) * джойстик.радиус;
      джойстик.базаY = джойстик.y - (дy / д) * джойстик.радиус;
    }
    пересчитатьДжойстик();
  }
}, { passive: false });

function отпуститьДжойстик(e) {
  if (e) e.preventDefault();
  джойстик.активен = false; джойстик.ид = null;
  джойстик.дx = 0; джойстик.дy = 0;
}

let аудио = null;
function разбудитьЗвук() {
  if (!аудио) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) аудио = new AC();
  }
  if (аудио && аудио.state === 'suspended') аудио.resume();
}

const ЗВУКИ = {
  бросок:       { форма:'square',   от:180, до:320,  длина:0.10, громкость:0.07 },
  попадание:    { форма:'square',   от:150, до:80,   длина:0.07, громкость:0.10 },
  смертьВрага:  { форма:'triangle', от:220, до:70,   длина:0.13, громкость:0.09 },
  левелап:      { форма:'triangle', от:420, до:980,  длина:0.32, громкость:0.15 },
  подборОпыта:  { форма:'sine',     от:760, до:1180, длина:0.05, громкость:0.05 },
  спасение:     { форма:'triangle', от:320, до:1250, длина:0.45, громкость:0.16 },
  босс:         { форма:'sawtooth', от:90,  до:40,   длина:0.90, громкость:0.20 },
  смертьИгрока: { форма:'sawtooth', от:300, до:40,   длина:0.80, громкость:0.18 },
  крик:         { форма:'sawtooth', от:520, до:120,  длина:0.30, громкость:0.13 },
  урон:         { форма:'square',   от:320, до:90,   длина:0.16, громкость:0.14 }
};

function звук(имя, сдвигТона = 1) {
  if (!аудио || аудио.state !== 'running') return;
  const с = ЗВУКИ[имя];
  if (!с) return;
  const t = аудио.currentTime;
  const осц = аудио.createOscillator();
  const гейн = аудио.createGain();
  осц.type = с.форма;
  осц.frequency.setValueAtTime(с.от * сдвигТона, t);
  осц.frequency.exponentialRampToValueAtTime(Math.max(20, с.до * сдвигТона), t + с.длина);
  гейн.gain.setValueAtTime(с.громкость, t);
  гейн.gain.exponentialRampToValueAtTime(0.0001, t + с.длина);
  осц.connect(гейн).connect(аудио.destination);
  осц.start(t); осц.stop(t + с.длина + 0.02);
}

function хеш(x, y) {
  let h = x * 374761393 + y * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967295;
}

// --- Текст с обводкой: должен читаться поверх хаоса из спрайтов ---
function текст(строка, x, y, о = {}) {
  const размер = о.размер || 18;
  кт.font = (о.вес || '800') + ' ' + размер + 'px system-ui, "Segoe UI", Roboto, Arial, sans-serif';
  кт.textAlign = о.выравн || 'left';
  кт.textBaseline = о.базовая || 'top';
  if (о.обводка !== false) {
    кт.lineWidth = о.толщинаОбводки || Math.max(3, размер * 0.22);
    кт.lineJoin = 'round';
    кт.strokeStyle = о.цветОбводки || ЦВЕТ.обводка;
    кт.strokeText(строка, x, y);
  }
  кт.fillStyle = о.цвет || ЦВЕТ.текст;
  кт.fillText(строка, x, y);
}

function ширинаТекста(строка, размер = 18, вес = '800') {
  кт.font = вес + ' ' + размер + 'px system-ui, "Segoe UI", Roboto, Arial, sans-serif';
  return кт.measureText(строка).width;
}

function скруглённыйПрямоугольник(x, y, ш, в, r) {
  кт.beginPath();
  кт.moveTo(x + r, y);
  кт.arcTo(x + ш, y,     x + ш, y + в, r);
  кт.arcTo(x + ш, y + в, x,     y + в, r);
  кт.arcTo(x,     y + в, x,     y,     r);
  кт.arcTo(x,     y,     x + ш, y,     r);
  кт.closePath();
}

/* localStorage бывает недоступен: песочница iframe, приватный режим,
   иногда file://. Тогда держим данные в памяти — забег хотя бы покажет
   свою таблицу, а не пустоту. */
const памятьХранилища = {};
let хранилищеРаботает = true;

function хранЧитать(ключ) {
  if (хранилищеРаботает) {
    try { return localStorage.getItem(ключ); }
    catch (e) { хранилищеРаботает = false; }
  }
  return памятьХранилища[ключ] !== undefined ? памятьХранилища[ключ] : null;
}
function хранПисать(ключ, значение) {
  памятьХранилища[ключ] = значение;
  if (!хранилищеРаботает) return;
  try { localStorage.setItem(ключ, значение); }
  catch (e) { хранилищеРаботает = false; }
}

/* ==========================================================================
   БЛОК 7. ОТРИСОВКА СПРАЙТА С ПРОЦЕДУРНОЙ АНИМАЦИЕЙ
   Отдельных кадров ходьбы нет. Живость даётся математикой поверх
   одного спрайта: подпрыгивание, наклон, squash/stretch, дыхание.
   ========================================================================== */

// Размер спрайта на экране в мировых единицах.
function габариты(ключ, масштаб = 1, ширинаX = 1) {
  const с = СПРАЙТ[ключ];
  if (!с) return { ш: 40 * масштаб, в: 100 * масштаб };
  return {
    ш: с.ш * МАСШТАБ_МИРА * масштаб * ширинаX,
    в: с.в * МАСШТАБ_МИРА * масштаб
  };
}

/* Спрайты в исходниках нарочно крупные, а на экране мелкие. Пересэмплировать
   176-пиксельный PNG под 97 пикселей каждый кадр для каждого из 250 врагов —
   это весь бюджет кадра. Поэтому масштабируем один раз и складываем в кэш,
   дальше идёт дешёвый блит один-к-одному.
   Заодно печём цветные силуэты: вспышку урона нельзя рисовать через
   source-atop по непрозрачному полу — зальётся весь прямоугольник, а не фигура. */
const кэшСпрайтов = new Map();

function готовыйСпрайт(ключ, масштаб, ширинаX, цвет) {
  const с = СПРАЙТ[ключ];
  if (!с || !с.готов) return null;
  const идент = ключ + '|' + масштаб.toFixed(2) + '|' + ширинаX.toFixed(2) + '|' + (цвет || '');
  let запись = кэшСпрайтов.get(идент);
  if (запись) return запись;

  const ш = Math.max(1, Math.round(с.ш * МАСШТАБ_МИРА * масштаб * ширинаX));
  const в = Math.max(1, Math.round(с.в * МАСШТАБ_МИРА * масштаб));
  const холст = document.createElement('canvas');
  холст.width = ш; холст.height = в;
  const к = холст.getContext('2d');
  к.imageSmoothingEnabled = true;
  к.imageSmoothingQuality = 'high';
  к.drawImage(с.картинка, 0, 0, ш, в);
  if (цвет) {                        // здесь альфа только у самой фигуры — силуэт выйдет чистым
    к.globalCompositeOperation = 'source-atop';
    к.fillStyle = цвет;
    к.fillRect(0, 0, ш, в);
  }
  запись = { холст, ш, в };
  кэшСпрайтов.set(идент, запись);
  return запись;
}

/* Наклон и сжатие — это поворот со скейлом, то есть пересэмплирование спрайта
   на каждом кадре для каждого врага. Анимация периодическая, поэтому печём
   восемь фаз в готовые позы и дальше кладём их обычным блитом без трансформа.
   Картинка получается ровно та же, только считается один раз.
   поза = -1 — стойка без наклона и сжатия. */
const ПОЗ = 8;
const кэшПоз = new Map();

/* В канвас позы запекаем СРАЗУ И ТЕНЬ, и подпрыгивание. Подпрыг зависит только
   от фазы, то есть от номера позы, — значит и ширина тени тоже. Поэтому враг
   рисуется одним drawImage один-к-одному: ни масштабирования, ни поворота,
   ни отдельного вызова под тень. Зеркальная сторона — отдельная копия. */
function готоваяПоза(ключ, масштаб, ширинаX, сторона, поза, цвет) {
  const с = СПРАЙТ[ключ];
  if (!с || !с.готов) return null;
  const идент = ключ + '|' + масштаб.toFixed(2) + '|' + ширинаX.toFixed(2) +
                '|' + сторона + '|' + поза + '|' + (цвет || '');
  let з = кэшПоз.get(идент);
  if (з) return з;

  const ш = Math.max(1, Math.round(с.ш * МАСШТАБ_МИРА * масштаб * ширинаX));
  const в = Math.max(1, Math.round(с.в * МАСШТАБ_МИРА * масштаб));

  const фаза   = (поза / ПОЗ) * Math.PI * 2;
  const наклон = поза < 0 ? 0 : Math.sin(фаза) * 0.05;
  const сжатие = поза < 0 ? 1 : 1 + Math.sin(фаза * 2) * 0.03;
  const подпрыг = поза < 0 ? 0 : Math.abs(Math.sin(фаза)) * 3 * масштаб;
  // тень пульсирует в противофазе с подпрыгиванием
  const шТени = Math.max(4, ш * 0.6 * (1 - Math.abs(поза < 0 ? 0 : Math.sin(фаза)) / 6));
  const вТени = шТени * 0.4;

  const полеX    = Math.ceil(в * 0.09) + 3;                 // запас под наклон
  const полеВерх = полеX + Math.ceil(подпрыг) + 2;
  const полеНиз  = Math.ceil(вТени / 2) + 2;

  const холст = document.createElement('canvas');
  холст.width  = ш + полеX * 2;
  холст.height = в + полеВерх + полеНиз;
  const к = холст.getContext('2d');
  к.imageSmoothingEnabled = true;
  к.imageSmoothingQuality = 'high';

  const якорьX = ш / 2 + полеX;
  const якорьY = в + полеВерх;
  к.translate(якорьX, якорьY);

  if (!цвет) {                       // тень только в базовой позе, не в силуэте
    к.globalAlpha = 0.32;
    к.fillStyle = '#000000';
    к.beginPath();
    к.ellipse(0, 0, шТени / 2, вТени / 2, 0, 0, Math.PI * 2);
    к.fill();
    к.globalAlpha = 1;
  }

  к.translate(0, -подпрыг);
  к.rotate(наклон * (сторона === -1 ? -1 : 1));
  к.scale(сторона === -1 ? -1 : 1, сжатие);
  к.drawImage(с.картинка, -ш / 2, -в, ш, в);
  if (цвет) {
    к.globalCompositeOperation = 'source-atop';
    к.fillStyle = цвет;
    к.fillRect(-ш * 2, -в * 2, ш * 4, в * 4);
  }

  з = { холст, якорьX, якорьY };
  кэшПоз.set(идент, з);
  return з;
}

/* Таблица поз: два массива готовых канвасов, вправо и влево.
   Индексы 0..ПОЗ-1 — фазы ходьбы, индекс ПОЗ — стойка.
   Нужна, чтобы в бою доставать позу прямым индексом массива. Сборка ключа
   строкой с toFixed на каждого из трёхсот врагов каждый кадр стоила дороже,
   чем сама отрисовка. */
function построитьТаблицу(ключ, масштаб, ширинаX, цвет) {
  const прав = [], лев = [];
  for (let п = 0; п < ПОЗ; п++) {
    прав.push(готоваяПоза(ключ, масштаб, ширинаX, 1, п, цвет));
    лев.push(готоваяПоза(ключ, масштаб, ширинаX, -1, п, цвет));
  }
  прав.push(готоваяПоза(ключ, масштаб, ширинаX, 1, -1, цвет));
  лев.push(готоваяПоза(ключ, масштаб, ширинаX, -1, -1, цвет));
  return { прав, лев };
}

/* Прогрев на загрузке. Иначе первые секунды забега подтормаживают:
   каждая новая пара «спрайт + поза» печётся прямо в кадре. */
function прогретьПозы() {
  for (const ид in ВРАГИ) {
    const ш = ВРАГИ[ид];
    if (ш.уникальный) continue;        // боссы рисуются масштабированием, им предрендер не нужен
    ш._база  = построитьТаблицу(ш.спрайт, ш.масштаб, ш.ширинаX, null);
    ш._белые = построитьТаблицу(ш.спрайт, ш.масштаб, ш.ширинаX, '#ffffff');
    ш._оттенок = ш.примета === 'пульсация'
      ? построитьТаблицу(ш.спрайт, ш.масштаб, ш.ширинаX, '#ff4040')
      : null;
  }
  построитьТаблицу('ilya_idle', 1, 1, null);
  построитьТаблицу('ilya_idle', 1, 1, '#ffffff');
  построитьТаблицу('shvarts', 1, 1, null);
  построитьТаблицу('shvarts', 1, 1, '#ffffff');
  for (const к of ['pet_tarakan', 'pet_tarakanische', 'pet_schenok',
                   'ally_leva2k', 'ally_d1pro4', 'ally_jaguarn1',
                   'ally_bondarenk01', 'ally_zzord']) {
    построитьТаблицу(к, 1, 1, null);
  }
  готовыйСпрайт('item_cherep', 1, 1, null);
  готовыйСпрайт('item_beluga', 1, 1, null);
  готовыйСпрайт('obj_kletka', 1.7, 1, null);
  готовыйСпрайт('item_xp', 1, 1, null);
  готовыйСпрайт('weapon_gantelya', 1, 1, null);
  готовыйСпрайт('anon', 0.5, 1, null);      // куски ТОЛПЫ в полёте
  готовыйКристалл();
}

/* x, y — точка НОГ в мировых координатах (низ спрайта).
   о.фаза — счётчик шагов, о.идёт, о.сторона, о.вспышка, о.масштаб, о.ширинаX,
   о.оттенок — цвет наложения, о.альфа. */
const ДВА_ПИ = Math.PI * 2;

function drawSprite(ключ, x, y, о = {}) {
  const с = СПРАЙТ[ключ];
  const масштаб = о.масштаб || 1;
  const ширинаX = о.ширинаX || 1;

  if (!с || !с.готов) {          // спрайт не догрузился — рисуем заглушку, но играем дальше
    const г = габариты(ключ, масштаб, ширинаX);
    кт.fillStyle = '#7a7a8c';
    кт.fillRect(x - г.ш / 2, y - г.в, г.ш, г.в);
    return;
  }

  const фаза = о.фаза || 0;
  const идёт = !!о.идёт;
  const сторона = о.сторона === -1 ? -1 : 1;
  // подпрыгивание, наклон, сжатие и тень уже внутри канваса позы
  const позаИндекс = идёт
    ? Math.floor((((фаза % ДВА_ПИ) + ДВА_ПИ) % ДВА_ПИ) / ДВА_ПИ * ПОЗ) % ПОЗ
    : -1;
  const дыхание = идёт ? 0 : Math.sin(ИГРА.времяВсего * 2);   // только для стоящих

  const поза = готоваяПоза(ключ, масштаб, ширинаX, сторона, позаИндекс, null);
  if (!поза) return;

  const пx = (x - поза.якорьX) | 0;
  const пy = (y + дыхание - поза.якорьY) | 0;

  // Без save/restore: на 300 врагов это 600 лишних операций со стеком состояния.
  const альфа = о.альфа !== undefined ? о.альфа : 1;
  if (альфа !== 1) кт.globalAlpha = альфа;
  кт.drawImage(поза.холст, пx, пy);

  // Вспышка урона и оттенок — та же поза, только запечённая в цвет.
  if (о.вспышка > 0) {
    const силуэт = готоваяПоза(ключ, масштаб, ширинаX, сторона, позаИндекс, '#ffffff');
    if (силуэт) {
      кт.globalAlpha = зажать(о.вспышка * 8, 0, 0.85) * альфа;
      кт.drawImage(силуэт.холст, пx, пy);
      кт.globalAlpha = 1;
      return;
    }
  } else if (о.оттенок) {
    const силуэт = готоваяПоза(ключ, масштаб, ширинаX, сторона, позаИндекс, о.оттенок);
    if (силуэт) {
      кт.globalAlpha = (о.силаОттенка !== undefined ? о.силаОттенка : 0.4) * альфа;
      кт.drawImage(силуэт.холст, пx, пy);
      кт.globalAlpha = 1;
      return;
    }
  }
  if (альфа !== 1) кт.globalAlpha = 1;
}


/* ==========================================================================
   БЛОК 8. ЭФФЕКТЫ
   ========================================================================== */

function частица(x, y, цвет, о = {}) {
  ИГРА.частицы.push({
    x, y,
    вx: о.вx !== undefined ? о.вx : случ(-120, 120),
    вy: о.вy !== undefined ? о.вy : случ(-200, -40),
    жизнь: о.жизнь || случ(0.3, 0.6),
    всего: 0,
    размер: о.размер || случ(3, 6),
    цвет,
    гравитация: о.гравитация !== undefined ? о.гравитация : 500
  });
  const ч = ИГРА.частицы[ИГРА.частицы.length - 1];
  ч.всего = ч.жизнь;
}

function брызги(x, y, цвет, сколько = 8) {
  for (let i = 0; i < сколько; i++) частица(x, y, цвет);
}

function всплывашка(x, y, строка, цвет, размер = 20) {
  ИГРА.всплывашки.push({ x, y, строка, цвет, размер, жизнь: 0.8, всего: 0.8 });
}

// Реплика над головой. Не оружие, урона нет, чистый юмор.
function пузырь(цельТип, цель, строка) {
  ИГРА.пузыри.push({ цельТип, цель, строка, жизнь: 2.2, всего: 2.2 });
}

function обновитьЭффекты(дт) {
  for (let i = ИГРА.частицы.length - 1; i >= 0; i--) {
    const ч = ИГРА.частицы[i];
    ч.вy += ч.гравитация * дт;
    ч.x += ч.вx * дт; ч.y += ч.вy * дт;
    ч.жизнь -= дт;
    if (ч.жизнь <= 0) ИГРА.частицы.splice(i, 1);
  }
  for (let i = ИГРА.всплывашки.length - 1; i >= 0; i--) {
    const в = ИГРА.всплывашки[i];
    в.y -= 55 * дт; в.жизнь -= дт;
    if (в.жизнь <= 0) ИГРА.всплывашки.splice(i, 1);
  }
  for (let i = ИГРА.пузыри.length - 1; i >= 0; i--) {
    const п = ИГРА.пузыри[i];
    п.жизнь -= дт;
    // враг умер — пузырь уходит вместе с ним
    if (п.жизнь <= 0 || (п.цельТип === 'враг' && п.цель.мёртв)) ИГРА.пузыри.splice(i, 1);
  }

  // случайная реплика раз в 4-6 сек над случайным участником боя
  ИГРА.таймерРеплики -= дт;
  if (ИГРА.таймерРеплики <= 0) {
    ИГРА.таймерРеплики = случ(РЕПЛИКИ_ИНТЕРВАЛ[0], РЕПЛИКИ_ИНТЕРВАЛ[1]);
    const видимые = ИГРА.враги.filter(в => в.гаснет <= 0 && наЭкране(в.x, в.y, 80));
    if (Math.random() < 0.45 || видимые.length === 0) пузырь('игрок', ИГРА.игрок, изМассива(РЕПЛИКИ));
    else пузырь('враг', изМассива(видимые), изМассива(РЕПЛИКИ));
  }
}

function наЭкране(x, y, запас = 0) {
  const эx = x - ИГРА.камера.x, эy = y - ИГРА.камера.y;
  return эx > -запас && эx < ЭКР.ш + запас && эy > -запас && эy < ЭКР.в + запас;
}


/* ==========================================================================
   БЛОК 9. ВРАГИ
   ========================================================================== */

function текущаяВолна() {
  let в = ВОЛНЫ[0];
  for (const w of ВОЛНЫ) if (w.t <= ИГРА.время && w.пул) в = w;
  return в;
}

/* Угол спавна. Илья вдвое быстрее обычного анона и в лоб его не догнать —
   если сыпать врагов равномерно по кругу, забег превращается в бесконечный
   отрыв на одной кнопке. Поэтому большую часть толпы ставим НАПЕРЕРЕЗ: игрок
   вбегает в новых врагов, скорость остаётся преимуществом, но заставляет
   выбирать маршрут. Стоит на месте — спавн равномерный. */
function уголСпавна() {
  const и = ИГРА.игрок;
  if (!и.идёт || Math.random() > БАЛАНС.долиНаперерез) return случ(0, ДВА_ПИ);
  const поХоду = Math.atan2(и.напрY, и.напрX);
  return поХоду + случ(-БАЛАНС.секторНаперерез, БАЛАНС.секторНаперерез);
}

// Точка спавна: за краем экрана, на окружности вокруг игрока.
function точкаСпавна(угол) {
  const и = ИГРА.игрок;
  const r = (ЭКР.диагональ / 2) * БАЛАНС.спавнПолудиагоналей * случ(1.0, 1.12);
  return { x: и.x + Math.cos(угол) * r, y: и.y + Math.sin(угол) * r };
}

/* Достигли технического потолка — не перестаём спавнить, а вытесняем самого
   дальнего врага за пределами экрана. Того, кто в кадре, не трогаем никогда:
   исчезновение анона на глазах игрока выглядит как баг. */
// Есть ли вообще куда спавнить: либо не упёрлись в потолок, либо найдётся
// кого вытеснить за экраном. Проверяем ДО списания бюджета, иначе очки
// угрозы сгорают впустую и после разгрузки волна недодаёт врагов.
const ЗАТУХАНИЕ = 0.3;

function радиусСпавна() {
  return (ЭКР.диагональ / 2) * БАЛАНС.спавнПолудиагоналей;
}

/* Кого вытеснить, когда упёрлись в потолок.
   Возвращает { индекс, гасить } или null.

   Отставший — это тот, кого игрок ОБОГНАЛ, то есть кто дальше радиуса спавна.
   Просто «самый дальний за экраном» не годится: новый враг появляется ровно
   на радиусе спавна и сам оказывается самым дальним, поэтому следующий же
   выпуск выселял только что созданного. Толпа крутилась на границе, и до
   игрока никто не доходил.

   Тех, кто за экраном, но ближе радиуса спавна, не трогаем — они идут к игроку.
   Если отставших нет вообще (игрок стоит, вся толпа в кадре), гасим самого
   дальнего из видимых за 0.3 сек: плавное исчезновение не читается как баг,
   а спавн при этом не глохнет. */
function найтиЖертву() {
  const и = ИГРА.игрок;
  const порог = радиусСпавна() * 1.08;
  let отставший = -1, дОтставшего = порог;
  let видимый = -1, дВидимого = -1;

  for (let i = 0; i < ИГРА.враги.length; i++) {
    const в = ИГРА.враги[i];
    // гарнизон и боссов не вытесняем: они и есть содержание момента
    if (в.гаснет > 0 || в.гарнизон || в.шаблон.уникальный) continue;
    const д = дистанция(в.x, в.y, и.x, и.y);
    if (д > дОтставшего) { дОтставшего = д; отставший = i; }
    else if (наЭкране(в.x, в.y, 140) && д > дВидимого) { дВидимого = д; видимый = i; }
  }

  if (отставший >= 0) return { индекс: отставший, гасить: false };
  if (видимый >= 0)   return { индекс: видимый,   гасить: true  };
  return null;
}

function естьМестоПодСпавн() {
  if (ИГРА.враги.length < БАЛАНС.потолокВрагов) return true;
  return найтиЖертву() !== null;
}

function освободитьМесто() {
  if (ИГРА.враги.length < БАЛАНС.потолокВрагов) return true;
  const жертва = найтиЖертву();
  if (!жертва) return false;
  if (жертва.гасить) ИГРА.враги[жертва.индекс].гаснет = ЗАТУХАНИЕ;
  else ИГРА.враги.splice(жертва.индекс, 1);
  return true;
}

function создатьВрага(тип, ш, т, настройки) {
  const масштаб = (настройки && настройки.масштаб) || ш.масштаб;
  const г = габариты(ш.спрайт, масштаб, ш.ширинаX);
  const в = {
    ид: ИГРА.следующийИдВрага++,
    тип, шаблон: ш,
    x: т.x, y: т.y,
    hp: ш.hp, максHp: ш.hp,
    скорость: ш.скорость * (ш.уникальный ? 1 : случ(0.92, 1.08)),
    масштаб,
    ш: г.ш * 0.55,               // хитбокс уже спрайта — так честнее ощущается
    в: г.в * 0.55,
    высотаСпрайта: г.в,
    ширинаСпрайта: г.ш,
    гаснет: 0,                   // >0 — вытесняется с затуханием, см. освободитьМесто
    фаза: случ(0, 6),
    сторона: 1,
    лицоX: 0, лицоY: 1,          // куда смотрит: туда, куда идёт. нужно Маске
    вспышка: 0,
    мёртв: false,
    кулдаунУдара: 0,
    оттолкX: 0, оттолкY: 0,
    замах: 0,                    // каминг-аут: обратный отсчёт до подрыва
    безвредность: 0,             // новорождённая мелочь не бьёт первые доли секунды
    встаёт: 0,                   // кусок ТОЛПЫ поднимается на ноги
    уронДоКуска: 0               // счётчик у босса
  };
  if (настройки) Object.assign(в, настройки);
  ИГРА.враги.push(в);
  return в;
}

function заспавнитьВрага(тип, точка) {
  const ш = ВРАГИ[тип];
  if (!ш) return;
  if (!освободитьМесто()) return;
  создатьВрага(тип, ш, точка || точкаСпавна(уголСпавна()));
}

/* Точка сразу за краем экрана в заданном направлении.
   Общий радиус спавна для босса не годится: при скорости 45 он шёл бы
   до игрока полминуты. Считаем расстояние до границы кадра по этому углу
   и добавляем небольшой запас, чтобы он не возникал на глазах. */
function точкаУКраяЭкрана(угол, запас) {
  const и = ИГРА.игрок;
  const кос = Math.cos(угол), син = Math.sin(угол);
  const доКрая = Math.min(
    Math.abs(кос) < 1e-4 ? Infinity : (ЭКР.ш / 2) / Math.abs(кос),
    Math.abs(син) < 1e-4 ? Infinity : (ЭКР.в / 2) / Math.abs(син)
  );
  const r = доКрая + запас;
  return { x: и.x + кос * r, y: и.y + син * r };
}

// Босс выходит сразу за краем экрана и лезет к игроку.
function вызватьБосса(имя, множительHp) {
  const ш = БОССЫ[имя];
  if (!ш) return;                          // ШВАРЦ придёт этапом 6
  освободитьМесто();
  const т = точкаУКраяЭкрана(случ(0, ДВА_ПИ), 160);
  const б = создатьВрага(имя, ш, т, { масштаб: ш.масштаб });
  if (множительHp) { б.hp *= множительHp; б.максHp *= множительHp; }
  ИГРА.босс = б;
  ИГРА.тряска = 14;
  звук('босс');
  всплывашка(ИГРА.игрок.x, ИГРА.игрок.y - 160, имя, ЦВЕТ.хп, 44);
}

// Случайный тип из пула волны по весам.
function типИзПула(пул) {
  let сумма = 0;
  for (const т in пул) сумма += пул[т];
  let бросок = Math.random() * сумма;
  for (const т in пул) {
    бросок -= пул[т];
    if (бросок <= 0) return т;
  }
  return Object.keys(пул)[0];
}

// Сколько очков угрозы стоит выпустить этот тип целиком (стая — целиком).
function ценаВыпуска(тип) {
  const ш = ВРАГИ[тип];
  if (!ш) return Infinity;
  return ш.цена * (ш.пачка || 1);
}

/* Спавн по бюджету угрозы. Копим очки каждый кадр и тратим их, пока хватает.
   Так стая мелочи автоматически съедает свою долю бюджета и не ломает кривую
   давления, а состав толпы задаётся весами пула. */
// Волны с боссом срабатывают один раз, когда до их времени дошёл таймер.
function проверитьБоссов() {
  for (let i = 0; i < ВОЛНЫ.length; i++) {
    const в = ВОЛНЫ[i];
    if (!в.босс || в.t > ИГРА.время || ИГРА.вызванныеБоссы.has(i)) continue;
    ИГРА.вызванныеБоссы.add(i);
    вызватьБосса(в.босс, в.множитель_hp);
  }
}

function обновитьСпавн(дт) {
  проверитьБоссов();
  const волна = текущаяВолна();
  if (!волна.пул || !волна.бюджет) return;

  ИГРА.бюджетСпавна = Math.min(
    ИГРА.бюджетСпавна + волна.бюджет * дт,
    БАЛАНС.максБюджетВЗапасе
  );

  /* Тип разыгрываем ЗАРАНЕЕ и копим бюджет именно под него.
     Если разыгрывать каждый кадр заново, дорогие типы голодают: пока копится
     на жирного за 5 очков, случайный анон за 2 успевает съесть накопленное,
     и в волне не появляется никого дороже двойки. */
  if (!ИГРА.планТипа || !волна.пул[ИГРА.планТипа]) {
    ИГРА.планТипа = типИзПула(волна.пул);
  }

  let выпусков = 0;
  while (выпусков < 40) {
    const цена = ценаВыпуска(ИГРА.планТипа);
    if (цена > ИГРА.бюджетСпавна) break;      // не по карману — копим дальше
    if (!естьМестоПодСпавн()) break;          // некуда — бюджет сохраняем на потом
    ИГРА.бюджетСпавна -= цена;
    выпустить(ИГРА.планТипа);
    ИГРА.планТипа = типИзПула(волна.пул);
    выпусков++;
  }
}

function выпустить(тип) {
  const ш = ВРАГИ[тип];
  if (!ш) return;
  if (!ш.пачка) { заспавнитьВрага(тип); return; }

  // Стая заходит кучно с одной стороны: так она читается как одна угроза,
  // от которой можно убежать. Рассыпанная по кругу — это стена без выхода.
  const центр = точкаСпавна(уголСпавна());
  for (let i = 0; i < ш.пачка; i++) {
    заспавнитьВрага(тип, {
      x: центр.x + случ(-БАЛАНС.разбросПачки, БАЛАНС.разбросПачки),
      y: центр.y + случ(-БАЛАНС.разбросПачки, БАЛАНС.разбросПачки)
    });
  }
}

// Расталкивание через пространственную сетку — на 250 врагах O(n^2) съел бы кадр.
const КЛЕТКА = 70;
const сетка = new Map();

function перестроитьСетку() {
  сетка.clear();
  for (let i = 0; i < ИГРА.враги.length; i++) {
    const в = ИГРА.враги[i];
    const ключ = Math.floor(в.x / КЛЕТКА) + ',' + Math.floor(в.y / КЛЕТКА);
    let с = сетка.get(ключ);
    if (!с) { с = []; сетка.set(ключ, с); }
    с.push(i);
  }
}

function обновитьВрагов(дт) {
  const и = ИГРА.игрок;
  перестроитьСетку();

  for (let i = ИГРА.враги.length - 1; i >= 0; i--) {
    const в = ИГРА.враги[i];

    // вытесняемый догорает и в бою больше не участвует
    if (в.гаснет > 0) {
      в.гаснет -= дт;
      if (в.гаснет <= 0) ИГРА.враги.splice(i, 1);
      continue;
    }

    // кусок ТОЛПЫ поднимается на ноги: не идёт и не бьёт, но уже уязвим
    if (в.встаёт > 0) {
      в.встаёт -= дт;
      if (в.вспышка > 0) в.вспышка -= дт;
      continue;
    }

    if (в.безвредность > 0) в.безвредность -= дт;

    // --- каминг-аут: замах перед подрывом ---
    if (в.шаблон.поведение === 'взрывается') {
      if (в.замах > 0) {
        в.замах -= дт;
        // пищит всё чаще по мере приближения детонации
        в.писк = (в.писк || 0) - дт;
        if (в.писк <= 0) {
          в.писк = 0.06 + (в.замах / КАМИНГ.замах) * 0.20;
          звук('попадание', 1.7 + (1 - в.замах / КАМИНГ.замах) * 1.2);
        }
        if (в.замах <= 0) { подорвать(в); continue; }
        continue;                       // на замахе стоит на месте, это и есть предупреждение
      }
      if (дистанция(в.x, в.y, и.x, и.y) < КАМИНГ.дистанцияЗамаха) {
        в.замах = КАМИНГ.замах;
        в.писк = 0;
        continue;
      }
    }

    /* Гарнизон клетки: спит, пока игрок не вошёл в зону, и привязан к посту.
       Отбежал от клетки дальше радиуса — разворачивается и идёт обратно,
       иначе игрок растащит гарнизон по одному и прорыв превратится
       в двадцать безопасных стычек. */
    let цель;
    if (в.гарнизон) {
      const кл = в.гарнизон;
      if (кл.открыта || кл.тает > 0) { в.гарнизон = null; в.спит = false; }
      else if (в.спит) {
        // стоит на посту, слегка переминаясь
        в.фаза += дт * 1.2;
        if (в.вспышка > 0) в.вспышка -= дт;
        if (в.кулдаунУдара > 0) в.кулдаунУдара -= дт;
        continue;
      } else if (дистанция(в.x, в.y, кл.x, кл.y) > ИВЕНТ.радиусПоста) {
        цель = { x: в.постX, y: в.постY };      // на пост
      }
    }
    if (!цель) цель = цельВрага(в);
    в.цель = цель;
    let скорость = в.скорость;
    // аура zzord: в её радиусе аноны вязнут
    const аура = ИГРА.аураЗамедления;
    if (аура && дистанция(в.x, в.y, аура.x, аура.y) < аура.радиус) скорость *= аура.коэф;

    const дx = цель.x - в.x, дy = цель.y - в.y;
    const д = Math.hypot(дx, дy) || 1;
    let двx = (дx / д) * скорость;
    let двy = (дy / д) * скорость;

    // расталкивание с соседями
    let отx = 0, отy = 0;
    const кx = Math.floor(в.x / КЛЕТКА), кy = Math.floor(в.y / КЛЕТКА);
    for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {
      const с = сетка.get((кx + ox) + ',' + (кy + oy));
      if (!с) continue;
      for (const j of с) {
        if (j === i) continue;
        const д2 = ИГРА.враги[j];
        const рx = в.x - д2.x, рy = в.y - д2.y;
        const рд = Math.hypot(рx, рy);
        const минимум = (в.ш + д2.ш) * 0.5;
        if (рд > 0.001 && рд < минимум) {
          // жирный расталкивает своих сильнее, чем они его
          const вес = (д2.шаблон.поведение === 'таранит' && в.шаблон.поведение !== 'таранит') ? 2.2 : 1;
          const сила = ((минимум - рд) / минимум) * вес;
          отx += (рx / рд) * сила; отy += (рy / рд) * сила;
        }
      }
    }
    двx += отx * 150; двy += отy * 150;

    // отброс от КРИКа затухает
    if (в.оттолкX || в.оттолкY) {
      двx += в.оттолкX; двy += в.оттолкY;
      const затух = Math.pow(0.0008, дт);
      в.оттолкX *= затух; в.оттолкY *= затух;
      if (Math.abs(в.оттолкX) < 2) в.оттолкX = 0;
      if (Math.abs(в.оттолкY) < 2) в.оттолкY = 0;
    }

    // ТОЛПА швыряет в игрока аноном: убегать не должно быть бесплатно
    if (в.шаблон.поведение === 'разваливается') {
      в.таймерБроска = (в.таймерБроска === undefined ? БРОСОК.интервал : в.таймерБроска) - дт;
      if (в.таймерБроска <= 0) { в.таймерБроска = БРОСОК.интервал; швырнутьАнона(в); }
    }

    в.x += двx * дт; в.y += двy * дт;
    в.фаза += дт * (в.скорость / 40);
    в.сторона = двx < 0 ? -1 : 1;

    // Куда смотрит — туда и идёт. Маске это нужно, чтобы отличать тыл от лба.
    const длина = Math.hypot(двx, двy);
    if (длина > 1) { в.лицоX = двx / длина; в.лицоY = двy / длина; }

    if (в.вспышка > 0) в.вспышка -= дт;
    if (в.кулдаунУдара > 0) в.кулдаунУдара -= дт;

    const уронВрага = в.урон !== undefined ? в.урон : в.шаблон.урон;

    // касание свиты: щенка грызут, танка бьют, а он их расталкивает
    if (в.кулдаунУдара <= 0 && в.безвредность <= 0 && цель !== и &&
        дистанция(в.x, в.y, цель.x, цель.y) < 44) {
      в.кулдаунУдара = 0.6;
      if (цель.максHp !== undefined && цель.конфиг) {          // танк
        цель.hp -= уронВрага;
        брызги(цель.x, цель.y - 40, ЦВЕТ.урон, 4);
        const оty = Math.atan2(в.y - цель.y, в.x - цель.x);
        в.оттолкX += Math.cos(оty) * цель.толчок;
        в.оттолкY += Math.sin(оty) * цель.толчок;
        if (цель.hp <= 0) цель.hp = 1;                         // танк не умирает, только продавливается
      } else {
        ранитьЩенка(цель, уронВрага);
      }
    }

    // касание игрока
    if (в.кулдаунУдара <= 0 && в.безвредность <= 0 &&
        Math.abs(в.x - и.x) < (в.ш + и.ш) * 0.5 &&
        Math.abs(в.y - и.y) < (в.в + и.в) * 0.5) {
      ранитьИгрока(уронВрага, в);
      в.кулдаунУдара = 0.6;
    }
  }
}

/* Подрыв каминг-аута. Бьёт и игрока, и своих: цепные подрывы в толпе —
   лучшее, что может случиться на экране, поэтому соседние камингы
   detonate почти сразу, а не мгновенно, чтобы цепочка читалась. */
function подорвать(в) {
  const и = ИГРА.игрок;
  const цy = в.y - в.высотаСпрайта * 0.4;

  ИГРА.кольца.push({ x: в.x, y: цy, r: 16, макс: КАМИНГ.радиус, жизнь: 0.35, всего: 0.35, цвет: '#ff6a3a' });
  ИГРА.тряска = Math.max(ИГРА.тряска, 7);
  брызги(в.x, цy, '#ff7a45', 18);
  звук('крик', 0.55);

  // по игроку
  if (дистанция(в.x, в.y, и.x, и.y) < КАМИНГ.радиус) ранитьИгрока(в.шаблон.урон, в);

  // по своим
  for (let j = ИГРА.враги.length - 1; j >= 0; j--) {
    const д = ИГРА.враги[j];
    if (д === в || д.гаснет > 0) continue;
    if (дистанция(д.x, д.y, в.x, в.y) > КАМИНГ.радиус) continue;
    if (д.шаблон.поведение === 'взрывается' && д.замах <= 0) {
      д.замах = КАМИНГ.цепнойЗамах;   // цепочка
      д.писк = 0;
    } else {
      уронВрагу(д, КАМИНГ.уронСвоим, в.x, цy, true);
    }
  }

  убитьВрага(в, true);       // без кристалла: он себя подорвал, а не был убит
}

/* Пришёлся ли удар в тыл Маски.
   Тыловой сектор — 120 градусов вокруг направления, противоположного взгляду. */
function попалВТыл(в, источникX, источникY) {
  if (источникX === undefined) return true;
  const кx = источникX - в.x, кy = источникY - в.y;
  const д = Math.hypot(кx, кy) || 1;
  // косинус угла между направлением на источник и взглядом
  const косинус = (кx / д) * в.лицоX + (кy / д) * в.лицоY;
  // тыл: источник позади, в пределах половины сектора от «спины»
  return косинус < -Math.cos(МАСКА.тыловойСектор / 2);
}

function отскокОтМаски(в, источникX, источникY) {
  const цy = в.y - в.высотаСпрайта * 0.55;
  всплывашка(в.x, цy, '0', '#dfe6f5', 26);
  звук('попадание', 2.6);
  // искра в точке касания щита
  const кx = источникX !== undefined ? источникX : в.x;
  const кy = источникY !== undefined ? источникY : цy;
  for (let i = 0; i < 7; i++) {
    частица(кx, кy, '#eaf2ff', { жизнь: случ(0.15, 0.3), размер: случ(2, 4), гравитация: 220 });
  }
}

function уронВрагу(в, урон, источникX, источникY, игнорироватьЩит) {
  // Маска: спереди — звонкий отскок и ноль, урон только со спины
  if (в.шаблон.поведение === 'щит' && !игнорироватьЩит &&
      !попалВТыл(в, источникX, источникY)) {
    отскокОтМаски(в, источникX, источникY);
    return;
  }

  в.hp -= урон;
  в.вспышка = 0.12;
  const цy = в.y - в.высотаСпрайта * 0.55;
  всплывашка(в.x + случ(-10, 10), цy, String(Math.round(урон)), ЦВЕТ.текст, 20);
  брызги(в.x, цy, '#b9b4c6', 4);
  звук('попадание', случ(0.9, 1.15));

  // ТОЛПА разваливается на глазах: каждые сто урона отлетает кусок
  if (в.шаблон.поведение === 'разваливается' && в.hp > 0) {
    в.уронДоКуска += урон;
    while (в.уронДоКуска >= в.шаблон.уронНаКусок) {
      в.уронДоКуска -= в.шаблон.уронНаКусок;
      отвалитьКусок(в);
    }
  }

  if (в.hp <= 0) убитьВрага(в);
}

function убитьВрага(в, безКристалла) {
  if (в.мёртв) return;
  в.мёртв = true;
  const индекс = ИГРА.враги.indexOf(в);
  if (индекс >= 0) ИГРА.враги.splice(индекс, 1);
  if (ИГРА.босс === в) ИГРА.босс = null;

  // спрайт разлетается на 8-12 частиц, у босса — щедрее
  const цy = в.y - в.высотаСпрайта * 0.5;
  const крупный = в.шаблон.уникальный;
  брызги(в.x, цy, '#9d98ab', крупный ? 40 : Math.round(случ(8, 12)));
  if (крупный) { ИГРА.тряска = Math.max(ИГРА.тряска, 12); звук('босс'); }
  ИГРА.убито++;
  звук('смертьВрага', случ(0.9, 1.1));

  // Делитель рождает двоих. Разлетаются В СТОРОНЫ, не в игрока, и первые
  // мгновения не бьют: добивание в упор не должно гарантированно снимать хп.
  if (в.шаблон.поведение === 'делится') {
    const и = ИГРА.игрок;
    const кИгроку = Math.atan2(и.y - в.y, и.x - в.x);
    for (let n = 0; n < ДЕЛИТЕЛЬ.сколько; n++) {
      const вбок = кИгроку + (n === 0 ? Math.PI / 2 : -Math.PI / 2) + случ(-0.3, 0.3);
      const м = создатьВрага('meloch', ВРАГИ.meloch, { x: в.x, y: в.y }, {
        безвредность: ДЕЛИТЕЛЬ.безвредность,
        оттолкX: Math.cos(вбок) * ДЕЛИТЕЛЬ.разлёт,
        оттолкY: Math.sin(вбок) * ДЕЛИТЕЛЬ.разлёт
      });
      м.кулдаунУдара = ДЕЛИТЕЛЬ.безвредность;
    }
  }

  // Награда за босса: череп плюс жирный сгусток опыта. Убийство ТОЛПЫ
  // должно быть самым выгодным событием на карте, иначе её просто обегают.
  if (в.шаблон.уникальный) {
    уронитьПредмет('cherep', в.x, в.y);
    const порция = НАГРАДА_БОССА.опыт / НАГРАДА_БОССА.кристаллов;
    for (let n = 0; n < НАГРАДА_БОССА.кристаллов; n++) {
      const у = (n / НАГРАДА_БОССА.кристаллов) * ДВА_ПИ;
      const к = { x: в.x + Math.cos(у) * 40, y: в.y + Math.sin(у) * 26 };
      уронитьКристалл(к.x, к.y, порция);
    }
    всплывашка(в.x, в.y - 120, 'ЧЕРЕП', '#6cff9a', 34);
    return;
  }

  if (!безКристалла) уронитьКристалл(в.x, в.y, в.шаблон.опыт);
}

/* Кусок ТОЛПЫ: вылетает по дуге, приземляется и становится обычным аноном,
   который полсекунды встаёт. Так видно причину и следствие, а не просто
   «из босса сыплются враги». Сам босс при этом чуть уменьшается. */
function отвалитьКусок(босс) {
  const угол = случ(0, ДВА_ПИ);
  const дальность = КУСОК.разлёт * случ(0.7, 1.3);
  ИГРА.куски.push({
    отX: босс.x, отY: босс.y - босс.высотаСпрайта * 0.5,
    доX: босс.x + Math.cos(угол) * дальность,
    доY: босс.y + Math.sin(угол) * дальность,
    t: 0, поворот: случ(0, ДВА_ПИ), вращение: случ(-6, 6)
  });
  const ш = босс.шаблон;
  босс.масштаб = Math.max(ш.минМасштаб, босс.масштаб - ш.усадка);
  const г = габариты(ш.спрайт, босс.масштаб, ш.ширинаX);
  босс.ширинаСпрайта = г.ш; босс.высотаСпрайта = г.в;
  босс.ш = г.ш * 0.55; босс.в = г.в * 0.55;
  ИГРА.тряска = Math.max(ИГРА.тряска, 5);
}

/* Бросок с упреждением: целимся туда, где игрок окажется к моменту
   приземления, иначе на скорости 240 снаряд всегда падает в спину. */
function швырнутьАнона(босс) {
  const и = ИГРА.игрок;
  const цx = и.x + и.вx * БРОСОК.полёт;
  const цy = и.y + и.вy * БРОСОК.полёт;
  ИГРА.куски.push({
    отX: босс.x, отY: босс.y - босс.высотаСпрайта * 0.5,
    доX: цx, доY: цy,
    t: 0, поворот: случ(0, ДВА_ПИ), вращение: случ(-9, 9),
    полёт: БРОСОК.полёт, дуга: БРОСОК.высотаДуги, урон: БРОСОК.урон
  });
  звук('бросок', 0.6);
}

// --- лут на карте ---
function уронитьПредмет(вид, x, y) {
  ИГРА.предметы.push({ вид, x, y, фаза: случ(0, ДВА_ПИ), жизнь: 45 });
}

function обновитьПредметы(дт) {
  const и = ИГРА.игрок;
  for (let i = ИГРА.предметы.length - 1; i >= 0; i--) {
    const п = ИГРА.предметы[i];
    п.фаза += дт * 2.5;
    п.жизнь -= дт;
    if (п.жизнь <= 0) { ИГРА.предметы.splice(i, 1); continue; }
    if (дистанция(п.x, п.y, и.x, и.y - и.в * 0.4) < 52) {
      ИГРА.предметы.splice(i, 1);
      if (п.вид === 'cherep') включитьРежимШварца();
    }
  }
}

/* Режим Шварца. Механика черепа тянется сюда из этапа 6: награда,
   которая ничего не делает, наградой не является. Сам босс ШВАРЦ придёт позже. */
function включитьРежимШварца() {
  const и = ИГРА.игрок;
  и.шварц = ЧЕРЕП.длительность;
  и.таймерШварцаHp = ЧЕРЕП.тикHp;
  ИГРА.тряска = 10;
  звук('босс');
  всплывашка(и.x, и.y - 150, 'ШВАРЦ НАСТИГ', '#6cff9a', 38);
}

function обновитьКуски(дт) {
  for (let i = ИГРА.куски.length - 1; i >= 0; i--) {
    const к = ИГРА.куски[i];
    к.t += дт / (к.полёт || КУСОК.полёт);
    к.поворот += к.вращение * дт;
    if (к.t < 1) continue;

    // приземлился — превращается в анона, который встаёт на ноги
    const м = создатьВрага('anon', ВРАГИ.anon, { x: к.доX, y: к.доY }, {
      встаёт: КУСОК.вставание
    });
    м.кулдаунУдара = КУСОК.вставание;
    брызги(к.доX, к.доY, '#8e8a9c', к.урон ? 16 : 10);
    звук('смертьВрага', 0.7);

    // брошенный анон бьёт при падении
    if (к.урон) {
      ИГРА.тряска = Math.max(ИГРА.тряска, 5);
      const и = ИГРА.игрок;
      if (дистанция(к.доX, к.доY, и.x, и.y) < БРОСОК.радиусУрона) ранитьИгрока(к.урон, null);
    }
    ИГРА.куски.splice(i, 1);
  }
}


/* ==========================================================================
   БЛОК 10. КРИСТАЛЛЫ ОПЫТА
   ========================================================================== */

function уронитьКристалл(x, y, ценность) {
  ИГРА.кристаллы.push({
    x: x + случ(-12, 12), y: y + случ(-12, 12),
    вx: случ(-70, 70), вy: случ(-70, 70),
    ценность,
    фаза: случ(0, 6.28),
    притянут: false
  });
}

function обновитьКристаллы(дт) {
  const и = ИГРА.игрок;
  const радиус = и.радиусСбора;

  for (let i = ИГРА.кристаллы.length - 1; i >= 0; i--) {
    const к = ИГРА.кристаллы[i];
    к.фаза += дт * 3;

    const д = дистанция(к.x, к.y, и.x, и.y - и.в * 0.4);
    if (д < радиус) к.притянут = true;

    if (к.притянут) {
      // магнит: чем ближе, тем быстрее — кристалл «всасывается»
      const скорость = 320 + (1 - зажать(д / Math.max(радиус, 1), 0, 1)) * 700;
      к.x += ((и.x - к.x) / (д || 1)) * скорость * дт;
      к.y += ((и.y - и.в * 0.4 - к.y) / (д || 1)) * скорость * дт;
      if (д < 26) {
        добавитьОпыт(к.ценность);
        ИГРА.кристаллы.splice(i, 1);
        continue;
      }
    } else {
      // разлетелся при выпадении и затормозил
      к.x += к.вx * дт; к.y += к.вy * дт;
      const затух = Math.pow(0.002, дт);
      к.вx *= затух; к.вy *= затух;
    }
  }
}

function добавитьОпыт(сколько) {
  const и = ИГРА.игрок;
  const итог = сколько * и.множительОпыта;
  ИГРА.опыт += итог;
  ИГРА.опытВсего += итог;
  звук('подборОпыта', случ(0.95, 1.15));

  let порог = БАЛАНС.порогУровня(ИГРА.уровень);
  while (ИГРА.опыт >= порог) {
    ИГРА.опыт -= порог;
    ИГРА.уровень++;
    порог = БАЛАНС.порогУровня(ИГРА.уровень);
    открытьЛевелап();
  }
}


/* ==========================================================================
   БЛОК 11. ОРУЖИЕ
   ========================================================================== */

/* Общий множитель урона: очки, ПРАЙМ и режим Шварца. */
function боевойМножитель(и) {
  return и.множительУрона
       * (и.праймОсталось > 0 ? 2 : 1)
       * (и.шварц > 0 ? ЧЕРЕП.урон : 1);
}

function ближайшийВраг(x, y, максД) {
  let лучший = null, лучшаяД = максД !== undefined ? максД : Infinity;
  for (const в of ИГРА.враги) {
    if (в.гаснет > 0) continue;               // вытесняемого не берём в прицел
    const д = дистанция(x, y, в.x, в.y);
    if (д < лучшаяД) { лучшаяД = д; лучший = в; }
  }
  return лучший;
}

// --- ГАНТЕЛЯ ---
function бросокГантели() {
  const и = ИГРА.игрок;
  const ур = и.апгрейды.gantelya || 1;
  const к = ГАНТЕЛЯ.уровни[ур - 1];

  const цель = ближайшийВраг(и.x, и.y - и.в * 0.4);
  let угол;
  if (цель) угол = Math.atan2(цель.y - (и.y - и.в * 0.4), цель.x - и.x);
  else угол = Math.atan2(и.напрY, и.напрX);

  const дальность = к.дальность * и.множительДальности;
  const разлёт = (к.разлёт * Math.PI) / 180;
  const старт = -(к.штук - 1) / 2;

  for (let n = 0; n < к.штук; n++) {
    const а = угол + (старт + n) * разлёт;
    ИГРА.гантели.push({
      x: и.x, y: и.y - и.в * 0.55,
      углX: Math.cos(а), углY: Math.sin(а),
      скорость: ГАНТЕЛЯ.скоростьБроска,
      // равномерное торможение до нуля ровно на заданной дальности
      замедление: (ГАНТЕЛЯ.скоростьБроска * ГАНТЕЛЯ.скоростьБроска) / (2 * дальность),
      возвратX: к.возвратX,
      урон: к.урон,
      поворот: случ(0, 6.28),
      фаза: 'вперёд',
      задетые: new Map(),        // ид врага -> сколько ждать до следующего урона
      жизнь: 6
    });
  }
  и.сторона = Math.cos(угол) < 0 ? -1 : 1;
  звук('бросок', случ(0.95, 1.08));
}

function обновитьГантели(дт) {
  const и = ИГРА.игрок;
  const г = габариты('weapon_gantelya');
  const радиусГантели = Math.max(г.ш, г.в) * 0.42;

  for (let i = ИГРА.гантели.length - 1; i >= 0; i--) {
    const гн = ИГРА.гантели[i];
    гн.поворот += дт * ГАНТЕЛЯ.вращение;
    гн.жизнь -= дт;

    if (гн.фаза === 'вперёд') {
      гн.скорость -= гн.замедление * дт;
      if (гн.скорость <= 0) { гн.скорость = 0; гн.фаза = 'назад'; }
      гн.x += гн.углX * гн.скорость * дт;
      гн.y += гн.углY * гн.скорость * дт;
    } else {
      // догоняет игрока по его ТЕКУЩЕЙ позиции, разгоняясь
      const цx = и.x, цy = и.y - и.в * 0.55;
      const д = дистанция(гн.x, гн.y, цx, цy) || 1;
      гн.скорость = Math.min(гн.скорость + 1400 * дт,
                             ГАНТЕЛЯ.скоростьВозврата * гн.возвратX);
      гн.x += ((цx - гн.x) / д) * гн.скорость * дт;
      гн.y += ((цy - гн.y) / д) * гн.скорость * дт;
      if (д < 34) { ИГРА.гантели.splice(i, 1); continue; }
    }

    if (гн.жизнь <= 0) { ИГРА.гантели.splice(i, 1); continue; }

    // остывание по каждому задетому врагу
    for (const [ид, т] of гн.задетые) {
      const н = т - дт;
      if (н <= 0) гн.задетые.delete(ид); else гн.задетые.set(ид, н);
    }

    // попадания: гантеля пробивает насквозь и врагов не толкает
    for (let j = ИГРА.враги.length - 1; j >= 0; j--) {
      const в = ИГРА.враги[j];
      if (в.гаснет > 0 || гн.задетые.has(в.ид)) continue;
      const вцy = в.y - в.высотаСпрайта * 0.45;
      if (Math.abs(гн.x - в.x) < (радиусГантели + в.ш * 0.5) &&
          Math.abs(гн.y - вцy) < (радиусГантели + в.в * 0.6)) {

        let урон = гн.урон * боевойМножитель(и);
        if (гн.фаза === 'назад' && гн.возвратX > 1) урон *= 2;
        const крит = и.шансКрита > 0 && Math.random() < и.шансКрита;
        if (крит) урон *= и.множительКрита;

        гн.задетые.set(в.ид, ГАНТЕЛЯ.кулдаунПоВрагу);
        const былЖирный = в.шаблон.hp >= 40;
        уронВрагу(в, урон, гн.x, гн.y);
        if (крит) всплывашка(в.x, вцy - 26, 'КРИТ', ЦВЕТ.золото, 18);
        // бросок должен быть весомым: по жирному экран вздрагивает
        if (былЖирный) ИГРА.тряска = Math.max(ИГРА.тряска, 5);
      }
    }
  }
}

// --- КРИК ---
function крикнуть() {
  const и = ИГРА.игрок;
  const ур = и.апгрейды.krik;
  const к = КРИК.уровни[ур - 1];
  const радиус = к.радиус * и.множительДальности;
  const цy = и.y - и.в * 0.45;

  ИГРА.кольца.push({ x: и.x, y: цy, r: 20, макс: радиус, жизнь: 0.42, всего: 0.42 });
  ИГРА.тряска = Math.max(ИГРА.тряска, 4);
  звук('крик');

  for (let j = ИГРА.враги.length - 1; j >= 0; j--) {
    const в = ИГРА.враги[j];
    if (в.гаснет > 0) continue;
    const д = дистанция(в.x, в.y, и.x, и.y);
    if (д > радиус) continue;
    const урон = к.урон * боевойМножитель(и);
    уронВрагу(в, урон, и.x, и.y - и.в * 0.45);
    if (!в.мёртв) {
      const нx = (в.x - и.x) / (д || 1), нy = (в.y - и.y) / (д || 1);
      в.оттолкX += нx * к.отброс; в.оттолкY += нy * к.отброс;
    }
  }
}

function обновитьКольца(дт) {
  for (let i = ИГРА.кольца.length - 1; i >= 0; i--) {
    const к = ИГРА.кольца[i];
    к.жизнь -= дт;
    const доля = 1 - к.жизнь / к.всего;
    к.r = 20 + (к.макс - 20) * (1 - Math.pow(1 - доля, 2));   // рывком наружу, потом плавно
    if (к.жизнь <= 0) ИГРА.кольца.splice(i, 1);
  }
}

// --- ОТЧЁТ ОТПРАВЛЕН ---
function отправитьОтчёт() {
  const и = ИГРА.игрок;
  const к = ОТЧЁТ.уровни[и.апгрейды.otchet - 1];
  const кандидаты = ИГРА.враги.filter(в => в.гаснет <= 0 && дистанция(в.x, в.y, и.x, и.y) < к.радиус);
  if (кандидаты.length === 0) { и.таймерОтчёта = 0.5; return; }   // некому — пробуем скоро снова

  for (let n = 0; n < к.целей && кандидаты.length > 0; n++) {
    const инд = Math.floor(Math.random() * кандидаты.length);
    const в = кандидаты.splice(инд, 1)[0];
    const цy = в.y - в.высотаСпрайта * 0.5;
    всплывашка(в.x, цy, 'отчёт отправлен', ЦВЕТ.золото, 18);
    брызги(в.x, цy, ЦВЕТ.золото, 14);
    убитьВрага(в);
  }
}

function обновитьОружие(дт) {
  const и = ИГРА.игрок;
  const мп = и.множительПерезарядки * (и.праймОсталось > 0 ? 0.5 : 1);

  // гантеля: новый бросок, когда откатилась перезарядка и все вернулись
  и.таймерГантели -= дт;
  if (и.таймерГантели <= 0 && ИГРА.гантели.length === 0) {
    бросокГантели();
    и.таймерГантели = ГАНТЕЛЯ.перезарядка * мп;
  }

  if (и.апгрейды.krik) {
    и.таймерКрика -= дт;
    if (и.таймерКрика <= 0) { крикнуть(); и.таймерКрика = КРИК.перезарядка * мп; }
  }
  if (и.апгрейды.otchet) {
    и.таймерОтчёта -= дт;
    if (и.таймерОтчёта <= 0) {
      отправитьОтчёт();
      if (и.таймерОтчёта <= 0) и.таймерОтчёта = ОТЧЁТ.уровни[и.апгрейды.otchet - 1].перезарядка * мп;
    }
  }
  if (и.апгрейды.praim) {
    const к = ПРАЙМ.уровни[и.апгрейды.praim - 1];
    и.таймерПрайма -= дт;
    if (и.таймерПрайма <= 0) {
      и.праймОсталось = к.длительность;
      и.таймерПрайма = к.перезарядка;
      всплывашка(и.x, и.y - и.в - 30, 'ПРАЙМ', ЦВЕТ.золото, 26);
      звук('левелап');
    }
  }
  if (и.праймОсталось > 0) и.праймОсталось -= дт;

  // пассивки по таймеру
  if (и.регенИнтервал > 0) {
    и.таймерРегена -= дт;
    if (и.таймерРегена <= 0) {
      и.таймерРегена = и.регенИнтервал;
      if (и.hp < и.максHp) {
        и.hp++;
        всплывашка(и.x, и.y - и.в - 10, '+1', ЦВЕТ.зелёный, 20);
      }
    }
  }
  if (и.щитИнтервал > 0 && !и.щитЗаряжен) {
    и.таймерЩита -= дт;
    if (и.таймерЩита <= 0) { и.щитЗаряжен = true; и.таймерЩита = и.щитИнтервал; }
  }
}


/* ==========================================================================
   БЛОК 11б. СВИТА: тараканы, щенки, пацаны из Пензы
   Свита не сталкивается с игроком и не толкает его — только с врагами.
   У каждого поводок: отбежал дальше ПОВОДОК — бросает цель и возвращается.
   ========================================================================== */

function уровеньСвиты(ид) { return ИГРА.игрок.апгрейды[ид] || 0; }

function пересобратьТараканов() {
  const ур = уровеньСвиты('tarakany');
  const к = ТАРАКАНЫ.уровни[ур - 1];
  const и = ИГРА.игрок;
  ИГРА.тараканы.length = 0;
  if (!к) return;
  for (let n = 0; n < к.штук; n++) {
    ИГРА.тараканы.push({
      x: и.x + случ(-40, 40), y: и.y + случ(-40, 40),
      фаза: случ(0, ДВА_ПИ), уголОрбиты: (n / к.штук) * ДВА_ПИ,
      кулдаун: случ(0, к.интервал), цель: null, сторона: 1
    });
  }
}

function пересобратьЩенков() {
  const ур = уровеньСвиты('schenki');
  const к = ЩЕНКИ.уровни[ур - 1];
  const и = ИГРА.игрок;
  const было = ИГРА.щенки.slice();
  ИГРА.щенки.length = 0;
  if (!к) return;
  const штук = к.штук + (и.бонусЩенков || 0);      // Aartll даёт щенка навсегда
  for (let n = 0; n < штук; n++) {
    const старый = было[n];
    ИГРА.щенки.push(старый ? Object.assign(старый, { максHp: к.hp, hp: Math.min(старый.hp, к.hp) }) : {
      x: и.x + случ(-50, 50), y: и.y + случ(-50, 50),
      фаза: случ(0, ДВА_ПИ), уголОрбиты: (n / штук) * ДВА_ПИ,
      кулдаун: 0, hp: к.hp, максHp: к.hp, выбыл: 0, сторона: 1
    });
  }
}

/* Взятие пацана. Одновременно активны максимум трое: четвёртый предлагает
   замену, потому что пятеро сразу — это каша и мгновенный автобой. */
function взятьСоюзника(ключ) {
  const уже = ИГРА.союзники.find(с => с.ключ === ключ);
  if (уже) { уже.уровень = ИГРА.игрок.апгрейды['ally_' + ключ]; return; }

  if (ИГРА.союзники.length >= МАКС_СОЮЗНИКОВ) {
    ИГРА.заменаНа = ключ;          // экран замены поднимется из взятьКарточку
    return;
  }
  добавитьСоюзника(ключ);
}

function добавитьСоюзника(ключ) {
  const к = СОЮЗНИКИ[ключ];
  const и = ИГРА.игрок;
  const с = {
    ключ, конфиг: к,
    уровень: и.апгрейды['ally_' + ключ] || 1,
    x: и.x + случ(-60, 60), y: и.y + случ(-60, 60),
    уголОрбиты: (ИГРА.союзники.length / МАКС_СОЮЗНИКОВ) * ДВА_ПИ + случ(-0.2, 0.2),
    фаза: случ(0, ДВА_ПИ), сторона: 1,
    кулдаун: случ(0, 1),
    hp: 0, максHp: 0,
    рывокОсталось: 0, рывокX: 0, рывокY: 0
  };
  if (к.роль === 'танк') {
    const п = к.уровни[с.уровень - 1];
    с.hp = п.hp; с.максHp = п.hp;
  }
  ИГРА.союзники.push(с);
}

function заменитьСоюзника(индекс) {
  const новый = ИГРА.заменаНа;
  ИГРА.заменаНа = null;
  if (индекс >= 0 && индекс < ИГРА.союзники.length) {
    const ушёл = ИГРА.союзники[индекс];
    ИГРА.союзники.splice(индекс, 1);
    всплывашка(ИГРА.игрок.x, ИГРА.игрок.y - 150, ушёл.ключ + ' ушёл', ЦВЕТ.текстТускл, 22);
  }
  if (новый) добавитьСоюзника(новый);
  ИГРА.экран = 'бой';
  продолжитьОчередьЛевелапов();
}

// --- общая механика: держаться у игрока, поводок, поиск цели ---
function держатьсяУИгрока(с, дт, орбита, скорость) {
  const и = ИГРА.игрок;
  с.уголОрбиты += (с.конфиг ? с.конфиг.скоростьОрбиты : 1.4) * дт;
  const цx = и.x + Math.cos(с.уголОрбиты) * орбита;
  const цy = и.y + Math.sin(с.уголОрбиты) * орбита * 0.6;
  const д = дистанция(с.x, с.y, цx, цy) || 1;
  if (д > 4) {
    const ш = Math.min(скорость * дт, д);
    с.x += ((цx - с.x) / д) * ш;
    с.y += ((цy - с.y) / д) * ш;
    if (Math.abs(цx - с.x) > 1) с.сторона = цx > с.x ? 1 : -1;
  }
}

function ближайшийВрагК(x, y, максД, фильтр) {
  let лучший = null, лучшаяД = максД;
  for (const в of ИГРА.враги) {
    if (в.гаснет > 0 || в.мёртв) continue;
    if (фильтр && !фильтр(в)) continue;
    const д = дистанция(x, y, в.x, в.y);
    if (д < лучшаяД) { лучшаяД = д; лучший = в; }
  }
  return лучший;
}

function обновитьТараканов(дт) {
  const ур = уровеньСвиты('tarakany');
  if (!ур) return;
  const к = ТАРАКАНЫ.уровни[ур - 1];
  const и = ИГРА.игрок;

  for (const т of ИГРА.тараканы) {
    т.фаза += дт * 9;
    if (т.кулдаун > 0) т.кулдаун -= дт;

    // поводок: убежал далеко — бросает цель и возвращается
    const доИгрока = дистанция(т.x, т.y, и.x, и.y);
    if (доИгрока > ПОВОДОК) т.цель = null;
    if (т.цель && (т.цель.мёртв || т.цель.гаснет > 0 ||
        дистанция(и.x, и.y, т.цель.x, т.цель.y) > ПОВОДОК)) т.цель = null;
    if (!т.цель) т.цель = ближайшийВрагК(и.x, и.y, ПОВОДОК);

    if (т.цель && доИгрока < ПОВОДОК) {
      const д = дистанция(т.x, т.y, т.цель.x, т.цель.y) || 1;
      const ш = Math.min(ТАРАКАНЫ.скорость * дт, д);
      т.x += ((т.цель.x - т.x) / д) * ш;
      т.y += ((т.цель.y - т.y) / д) * ш;
      т.сторона = т.цель.x > т.x ? 1 : -1;
      if (д < к.радиусУкуса && т.кулдаун <= 0) {
        т.кулдаун = к.интервал;
        const цель = т.цель;
        уронВрагу(цель, к.урон * боевойМножитель(и), т.x, т.y);
        ИГРА.уронСвиты += к.урон;
        // взрывные: враг упал — таракан детонирует
        if (к.взрыв && цель.мёртв) взрывТаракана(т, к.взрыв);
      }
    } else {
      // нет цели или сорвался с поводка — бежит обратно к хозяину
      т.уголОрбиты += 1.6 * дт;
      const цx = и.x + Math.cos(т.уголОрбиты) * 62;
      const цy = и.y + Math.sin(т.уголОрбиты) * 38;
      const д = дистанция(т.x, т.y, цx, цy) || 1;
      if (д > 3) {
        const ш = Math.min(ТАРАКАНЫ.скорость * дт, д);
        т.x += ((цx - т.x) / д) * ш;
        т.y += ((цy - т.y) / д) * ш;
        т.сторона = цx > т.x ? 1 : -1;
      }
    }
  }
}

function взрывТаракана(т, урон) {
  ИГРА.кольца.push({ x: т.x, y: т.y, r: 10, макс: ТАРАКАНЫ.радиусВзрыва,
                     жизнь: 0.25, всего: 0.25, цвет: '#e08a3a' });
  брызги(т.x, т.y, '#c9762f', 10);
  for (const в of ИГРА.враги) {
    if (в.гаснет > 0 || в.мёртв) continue;
    if (дистанция(в.x, в.y, т.x, т.y) > ТАРАКАНЫ.радиусВзрыва) continue;
    уронВрагу(в, урон, т.x, т.y, true);
    ИГРА.уронСвиты += урон;
  }
}

function обновитьЩенков(дт) {
  const ур = уровеньСвиты('schenki');
  if (!ур) return;
  const к = ЩЕНКИ.уровни[ур - 1];
  const и = ИГРА.игрок;

  for (const щ of ИГРА.щенки) {
    if (щ.выбыл > 0) {
      щ.выбыл -= дт;
      if (щ.выбыл <= 0) { щ.hp = к.hp; щ.x = и.x; щ.y = и.y; }
      continue;
    }
    щ.фаза += дт * 7;
    if (щ.кулдаун > 0) щ.кулдаун -= дт;

    const доИгрока = дистанция(щ.x, щ.y, и.x, и.y);
    let цель = null;
    if (доИгрока < ПОВОДОК) цель = ближайшийВрагК(и.x, и.y, ПОВОДОК);

    if (цель) {
      const д = дистанция(щ.x, щ.y, цель.x, цель.y) || 1;
      const ш = Math.min(ЩЕНКИ.скорость * дт, д);
      щ.x += ((цель.x - щ.x) / д) * ш;
      щ.y += ((цель.y - щ.y) / д) * ш;
      щ.сторона = цель.x > щ.x ? 1 : -1;
      if (д < ЩЕНКИ.радиусУкуса && щ.кулдаун <= 0) {
        щ.кулдаун = к.интервал;
        уронВрагу(цель, к.урон * боевойМножитель(и), щ.x, щ.y);
        ИГРА.уронСвиты += к.урон;
      }
    } else {
      const цx = и.x + Math.cos(щ.уголОрбиты) * 85;
      const цy = и.y + Math.sin(щ.уголОрбиты) * 50;
      щ.уголОрбиты += 1.1 * дт;
      const д = дистанция(щ.x, щ.y, цx, цy) || 1;
      if (д > 4) {
        const ш = Math.min(ЩЕНКИ.скорость * дт, д);
        щ.x += ((цx - щ.x) / д) * ш; щ.y += ((цy - щ.y) / д) * ш;
        щ.сторона = цx > щ.x ? 1 : -1;
      }
    }

    // «приносят XP»: подбирают кристаллы и отдают опыт хозяину
    for (let i = ИГРА.кристаллы.length - 1; i >= 0; i--) {
      const кр = ИГРА.кристаллы[i];
      if (дистанция(кр.x, кр.y, щ.x, щ.y) < ЩЕНКИ.радиусСбора * 0.35) {
        добавитьОпыт(кр.ценность);
        ИГРА.кристаллы.splice(i, 1);
      }
    }
  }
}

function ранитьЩенка(щ, урон) {
  if (щ.выбыл > 0) return;
  щ.hp -= урон;
  брызги(щ.x, щ.y, '#d8a86a', 5);
  if (щ.hp <= 0) {
    щ.выбыл = ЩЕНКИ.возрождение;
    брызги(щ.x, щ.y, '#d8a86a', 12);
    всплывашка(щ.x, щ.y - 30, 'щенок пал', ЦВЕТ.текстТускл, 18);
  }
}

function обновитьСоюзников(дт) {
  const и = ИГРА.игрок;
  ИГРА.аураЗамедления = null;

  for (const с of ИГРА.союзники) {
    const к = с.конфиг;
    const п = к.уровни[Math.min(с.уровень, к.уровни.length) - 1];
    с.фаза += дт * 6;
    if (с.кулдаун > 0) с.кулдаун -= дт;

    if (к.роль === 'таран' && с.рывокОсталось > 0) {
      с.рывокОсталось -= дт;
      с.x += с.рывокX * дт; с.y += с.рывокY * дт;
      с.задетоЗаПроход = с.задетоЗаПроход || 0;
      for (const в of ИГРА.враги) {
        if (с.задетоЗаПроход >= п.целей) break;
        if (в.гаснет > 0 || в.мёртв || в._таранен === с.метка) continue;
        if (дистанция(в.x, в.y, с.x, с.y) > 55) continue;
        в._таранен = с.метка;
        с.задетоЗаПроход++;
        уронВрагу(в, п.урон * боевойМножитель(и), с.x, с.y);
        ИГРА.уронСвиты += п.урон;
      }
      continue;
    }

    держатьсяУИгрока(с, дт, к.орбита, 420);

    if (к.роль === 'ближний') {
      if (с.кулдаун <= 0) {
        let попал = false, задето = 0;
        for (const в of ИГРА.враги) {
          if (задето >= п.целей) break;
          if (в.гаснет > 0 || в.мёртв) continue;
          if (дистанция(в.x, в.y, с.x, с.y) > п.радиус) continue;
          уронВрагу(в, п.урон * боевойМножитель(и), с.x, с.y);
          ИГРА.уронСвиты += п.урон;
          попал = true; задето++;
        }
        if (попал) {
          с.кулдаун = п.интервал;
          ИГРА.кольца.push({ x: с.x, y: с.y - 30, r: 8, макс: п.радиус,
                             жизнь: 0.18, всего: 0.18, цвет: '#ffd08a' });
        }
      }
    } else if (к.роль === 'снайпер') {
      if (с.кулдаун <= 0) {
        // бьёт самых дальних: ближних и так есть кому месить
        let цель = null, лучшая = -1;
        for (const в of ИГРА.враги) {
          if (в.гаснет > 0 || в.мёртв) continue;
          const д = дистанция(в.x, в.y, и.x, и.y);
          if (д <= п.дальность && д > лучшая) { лучшая = д; цель = в; }
        }
        if (цель) {
          с.кулдаун = п.интервал;
          ИГРА.выстрелы.push({
            x: с.x, y: с.y - 40, цель,
            урон: п.урон * боевойМножитель(и), жизнь: 2.5
          });
        }
      }
    } else if (к.роль === 'танк') {
      if (с.максHp !== п.hp) { с.максHp = п.hp; с.hp = п.hp; }
      с.агро = п.агро; с.толчок = п.толчок;
      if (с.hp < с.максHp) с.hp = Math.min(с.максHp, с.hp + дт * 3);   // отдышивается
    } else if (к.роль === 'таран') {
      if (с.кулдаун <= 0) {
        const цель = ближайшийВрагК(и.x, и.y, п.дальность);
        if (цель) {
          с.кулдаун = п.интервал;
          const у = Math.atan2(цель.y - с.y, цель.x - с.x);
          с.рывокX = Math.cos(у) * 900; с.рывокY = Math.sin(у) * 900;
          с.рывокОсталось = 0.35;
          с.метка = (с.метка || 0) + 1;
          с.задетоЗаПроход = 0;
          с.сторона = Math.cos(у) < 0 ? -1 : 1;
        }
      }
    } else if (к.роль === 'аура') {
      ИГРА.аураЗамедления = { x: и.x, y: и.y, радиус: п.радиус, коэф: п.замедление };
    }
  }
}

function обновитьВыстрелы(дт) {
  for (let i = ИГРА.выстрелы.length - 1; i >= 0; i--) {
    const в = ИГРА.выстрелы[i];
    в.жизнь -= дт;
    const ц = в.цель;
    if (в.жизнь <= 0 || !ц || ц.мёртв) { ИГРА.выстрелы.splice(i, 1); continue; }
    const цy = ц.y - ц.высотаСпрайта * 0.5;
    const д = дистанция(в.x, в.y, ц.x, цy) || 1;
    const ш = Math.min(1300 * дт, д);
    в.x += ((ц.x - в.x) / д) * ш; в.y += ((цy - в.y) / д) * ш;
    if (д < 20) {
      уронВрагу(ц, в.урон, в.x, в.y);
      ИГРА.уронСвиты += в.урон;
      брызги(в.x, в.y, '#cfe6ff', 4);
      ИГРА.выстрелы.splice(i, 1);
    }
  }
}

function обновитьСвиту(дт) {
  обновитьТараканов(дт);
  обновитьЩенков(дт);
  обновитьСоюзников(дт);
  обновитьВыстрелы(дт);
}

/* Кого враг считает целью. Щенки и танк перетягивают агро на себя —
   в этом весь их смысл. Остальные идут на игрока. */
function цельВрага(в) {
  const и = ИГРА.игрок;
  let цель = null, лучшая = Infinity;

  for (const щ of ИГРА.щенки) {
    if (щ.выбыл > 0) continue;
    const д = дистанция(в.x, в.y, щ.x, щ.y);
    if (д < ЩЕНКИ.радиусАгро && д < лучшая) { лучшая = д; цель = щ; }
  }
  for (const с of ИГРА.союзники) {
    if (с.конфиг.роль !== 'танк' || !с.агро) continue;
    const д = дистанция(в.x, в.y, с.x, с.y);
    if (д < с.агро && д < лучшая) { лучшая = д; цель = с; }
  }
  return цель || и;
}


/* ==========================================================================
   БЛОК 11в. ИВЕНТ СПАСЕНИЯ ДОНАТЕРА
   ========================================================================== */

function свободныеДонатеры() {
  return Object.keys(ДОНАТЕРЫ).filter(к =>
    к !== 'galiopola' && !ИГРА.спасённые.some(с => с.ключ === к) && ИГРА.занятыеДонатеры.indexOf(к) < 0);
}

function запуститьИвент(ключ) {
  const д = ДОНАТЕРЫ[ключ];
  if (!д) return;
  const и = ИГРА.игрок;
  const угол = случ(0, ДВА_ПИ);
  const r = случ(ИВЕНТ.дистанцияОт, ИВЕНТ.дистанцияДо);
  const кx = и.x + Math.cos(угол) * r, кy = и.y + Math.sin(угол) * r;

  const клетка = {
    ключ, донатер: д, x: кx, y: кy,
    осталось: ИВЕНТ.времяНаСпасение,
    прогресс: 0, взламывается: false,
    таймерПодкрепления: ИВЕНТ.подкреплениеРаз,
    пробуждён: false, открыта: false, тает: 0,
    фаза: случ(0, ДВА_ПИ)
  };
  ИГРА.клетка = клетка;
  ИГРА.занятыеДонатеры.push(ключ);

  // гарнизон стоит постом вокруг клетки и не преследует, пока игрок не вошёл
  const сколько = Math.round(случ(ИВЕНТ.гарнизонОт, ИВЕНТ.гарнизонДо)) * (д.злее || 1);
  for (let n = 0; n < сколько; n++) {
    const у = (n / сколько) * ДВА_ПИ + случ(-0.15, 0.15);
    const рп = случ(90, 210);
    const пx = кx + Math.cos(у) * рп, пy = кy + Math.sin(у) * рп;
    const тип = д.злее ? изМассива(['anon', 'anon', 'zhirniy', 'maska']) : изМассива(['anon', 'anon', 'anon', 'meloch']);
    создатьВрага(тип, ВРАГИ[тип], { x: пx, y: пy }, {
      гарнизон: клетка, постX: пx, постY: пy, спит: true
    });
  }
  звук('спасение', 0.7);
}

function обновитьРасписаниеИвентов(дт) {
  const и = ИГРА.игрок;

  // Пока жив босс — откладываем. Игрок не должен разрываться между двумя
  // обязательными делами, зная, что не успеет ни одного.
  if (ИГРА.босс && !ИГРА.босс.мёртв) { ИГРА.пауза_после_босса = ИВЕНТ.задержкаПослеБосса; return; }
  if (ИГРА.пауза_после_босса > 0) { ИГРА.пауза_после_босса -= дт; return; }
  if (ИГРА.клетка) return;

  // galiopola выходит на 330-й: по ТЗ около пятой минуты, но там Шварц,
  // поэтому сразу после него.
  if (!ИГРА.былаGaliopola && ИГРА.время >= 330) {
    ИГРА.былаGaliopola = true;
    ИГРА.таймерИвента = ИВЕНТ.интервал;
    запуститьИвент('galiopola');
    return;
  }

  ИГРА.таймерИвента -= дт;
  if (ИГРА.таймерИвента > 0) return;
  ИГРА.таймерИвента = ИВЕНТ.интервал;
  const пул = свободныеДонатеры();
  if (пул.length) запуститьИвент(изМассива(пул));
}

function обновитьКлетку(дт) {
  const к = ИГРА.клетка;
  if (!к) return;
  const и = ИГРА.игрок;
  к.фаза += дт * 2;

  if (к.тает > 0) {                       // провалили: клетка растворяется
    к.тает -= дт;
    if (к.тает <= 0) ИГРА.клетка = null;
    return;
  }
  if (к.открыта) { ИГРА.клетка = null; return; }

  к.осталось -= дт;
  if (к.осталось <= 0) { провалитьИвент(к); return; }

  if (!к.пробуждён && дистанция(и.x, и.y, к.x, к.y) < ИВЕНТ.радиусПробуждения) {
    к.пробуждён = true;
    for (const в of ИГРА.враги) if (в.гарнизон === к) в.спит = false;
  }

  // остался ли кто из гарнизона
  let живГарнизон = 0;
  for (const в of ИГРА.враги) if (в.гарнизон === к && в.гаснет <= 0) живГарнизон++;

  const вКруге = дистанция(и.x, и.y, к.x, к.y) < ИВЕНТ.радиусВзлома;
  к.взламывается = вКруге && живГарнизон === 0;

  if (к.взламывается) {
    к.прогресс += дт;
    // пока стоишь — прёт подкрепление, и прёт ОТ КЛЕТКИ, чтобы видно откуда
    к.таймерПодкрепления -= дт;
    if (к.таймерПодкрепления <= 0) {
      к.таймерПодкрепления = ИВЕНТ.подкреплениеРаз;
      const сколько = 3;
      for (let n = 0; n < сколько; n++) {
        const у = случ(0, ДВА_ПИ);
        создатьВрага('anon', ВРАГИ.anon,
          { x: к.x + Math.cos(у) * 40, y: к.y + Math.sin(у) * 40 },
          { встаёт: 0.35 });
      }
      брызги(к.x, к.y, '#8e8a9c', 8);
    }
    if (к.прогресс >= ИВЕНТ.времяВзлома) спастиДонатера(к);
  } else if (к.прогресс > 0) {
    // откат плавный: случайный шаг в сторону не должен обнулять четыре секунды
    к.прогресс = Math.max(0, к.прогресс - дт * ИВЕНТ.скоростьОтката);
  }
}

function спастиДонатера(к) {
  const и = ИГРА.игрок;
  к.открыта = true;
  const д = к.донатер;

  // Момент спасения — тот кадр, который люди постят в чат.
  ИГРА.вспышкаЭкрана = 1;
  ИГРА.замедление = 0.3;
  ИГРА.тряска = 10;
  звук('спасение', д.топ ? 1.0 : 0.85);
  if (д.топ) { setTimeout(() => звук('левелап', 1.3), 140); setTimeout(() => звук('спасение', 1.25), 300); }

  ИГРА.взлетающийНик = { текст: д.ник, x: к.x, y: к.y - 120, жизнь: 2.2, всего: 2.2, топ: !!д.топ };

  // донатер выбегает из клетки, машет и уходит за край
  const уход = Math.atan2(и.y - к.y, и.x - к.x) + случ(-0.6, 0.6);
  ИГРА.убегающие.push({
    спрайт: д.спрайт, x: к.x, y: к.y,
    вx: Math.cos(уход) * 260, вy: Math.sin(уход) * 260,
    фаза: 0, жизнь: 4, машет: 0.8, сторона: Math.cos(уход) < 0 ? -1 : 1
  });

  // веер кристаллов
  for (let n = 0; n < 22; n++) {
    const у = (n / 22) * ДВА_ПИ;
    уронитьКристалл(к.x + Math.cos(у) * 55, к.y + Math.sin(у) * 38, 6);
  }

  ИГРА.спасённые.push({ ключ: к.ключ, ник: д.ник, иконка: д.иконка, бонус: д.бонус });
