<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>СУСЛОВ: ВЫЖИВАЧ</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #1a1820; overflow: hidden;
    font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  canvas {
    display: block; width: 100%; height: 100%; cursor: default;
    touch-action: none;              /* иначе страница будет скроллиться под пальцем */
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
  }
  html, body { touch-action: none; overscroll-behavior: none; }

  /* Поле ника: канвас текст не принимает, нужен настоящий input */
  #ник {
    position: absolute; left: 50%; transform: translateX(-50%);
    display: none; z-index: 10;
    width: 260px; padding: 11px 14px;
    border-radius: 10px; text-align: center;
    background: rgba(32, 30, 43, 0.9);
    border: 1px solid rgba(220, 215, 235, 0.28);
    color: #f2f0f6; outline: none;
    font: 700 18px system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  }
  #ник::placeholder { color: #7d7890; font-weight: 600; }
  #ник:focus { border-color: #8fb6ff; background: rgba(44, 42, 60, 0.95); }
  #fb {
    position: absolute; left: 50%; transform: translateX(-50%);
    display: none; z-index: 10;
    padding: 9px 18px; border-radius: 10px;
    background: rgba(32, 30, 43, 0.82);
    border: 1px solid rgba(220, 215, 235, 0.22);
    color: #cfc9dd; text-decoration: none;
    font: 600 15px system-ui, "Segoe UI", Roboto, Arial, sans-serif;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  /* Кнопка полного экрана.

     Настоящий <button>, а не рисованная на канвасе. Причина техническая:
     клики по канвасу обрабатываются в игровом цикле (обработатьКлик в кадре),
     то есть уже НЕ внутри обработчика события мыши. Браузер разрешает
     requestFullscreen только из пользовательского жеста, и из цикла вызов
     молча отклоняется. Из обработчика click на HTML-кнопке — работает. */
  #fs {
    position: absolute; top: 12px; right: 12px;
    /* В бою справа сверху стоит счётчик анонов, поэтому кнопка чуть меньше
       и полупрозрачнее в бою — класс ставится из игры. */
    display: none; z-index: 11;
    width: 42px; height: 42px; padding: 0;
    border-radius: 10px; cursor: pointer;
    background: rgba(32, 30, 43, 0.82);
    border: 1px solid rgba(220, 215, 235, 0.22);
    color: #cfc9dd;
    font: 700 20px system-ui, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 40px; text-align: center;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  #fs:hover { background: rgba(60, 79, 134, 0.9); border-color: #8fb6ff; color: #f2f0f6; }

  /* ЗВУК: кнопка-динамик и панель с ползунками.

     Ползунки — настоящие <input type="range">, а не нарисованные на канвасе.
     Причина та же, что у поля ника: тянуть пальцем нарисованный ползунок
     пришлось бы реализовывать самому, включая попадание по нему на телефоне,
     а нативный range это умеет из коробки и доступен с клавиатуры. */
  #звук {
    position: absolute; top: 12px; right: 62px;
    display: none; z-index: 11;
    width: 42px; height: 42px; padding: 0;
    border-radius: 10px; cursor: pointer;
    background: rgba(32, 30, 43, 0.82);
    border: 1px solid rgba(220, 215, 235, 0.22);
    color: #cfc9dd;
    font: 700 18px system-ui, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 40px; text-align: center;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  #звук:hover { background: rgba(60, 79, 134, 0.9); border-color: #8fb6ff; color: #f2f0f6; }
  #звук.вбою { opacity: 0.45; width: 38px; height: 38px; line-height: 36px; font-size: 15px; right: 58px; }
  #звук.вбою:hover { opacity: 1; }
  #звукПанель {
    position: absolute; top: 62px; right: 12px;
    display: none; z-index: 12;
    width: 214px; padding: 12px 14px 14px;
    border-radius: 12px;
    background: rgba(24, 22, 32, 0.96);
    border: 1px solid rgba(220, 215, 235, 0.22);
    color: #cfc9dd;
    font: 700 13px system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  }
  #звукПанель .строка { display: flex; justify-content: space-between; margin-bottom: 4px; }
  #звукПанель .строка + input { margin-bottom: 12px; }
  #звукПанель input[type="range"] {
    width: 100%; margin: 0; accent-color: #6cff9a;
    height: 26px;              /* палец должен попадать, а не целиться */
  }
  /* В бою кнопка приглушена, чтобы не тянуть на себя внимание с боя,
     но остаётся нажимаемой и попадает под палец. */
  #fs.вбою { opacity: 0.45; width: 38px; height: 38px; line-height: 36px; font-size: 17px; }
  #fs.вбою:hover { opacity: 1; }

  #fb:hover {
    background: rgba(60, 79, 134, 0.9);
    border-color: #8fb6ff;
    color: #f2f0f6;
  }

  /* Ссылки на сайт и твич Суслова.

     Тоже настоящие <a>, а не рисованные на канвасе кнопки. Причина та же,
     что у #fb и #fs: клик по канвасу обрабатывается в игровом цикле, уже вне
     обработчика события, а браузеры (и особенно iOS в рамке на чужом сайте)
     открывают новую вкладку только из пользовательского жеста. window.open
     из кадра молча блокируется блокировщиком попапов.

     Строка целиком центрируется флексом: раньше каждый оверлей позиционировал
     себя сам через left:50% + translateX, и для двух кнопок рядом пришлось бы
     считать половины ширин в JS — при разной длине подписей это разъезжается. */
  #внешние {
    position: absolute; left: 50%; transform: translateX(-50%);
    display: none; z-index: 10;
    gap: 10px; white-space: nowrap;
  }
  #внешние a, #внешние button {
    padding: 9px 16px; border-radius: 10px;
    background: rgba(32, 30, 43, 0.82);
    border: 1px solid rgba(220, 215, 235, 0.22);
    color: #cfc9dd; text-decoration: none;
    font: 700 15px system-ui, "Segoe UI", Roboto, Arial, sans-serif;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  #внешние a:hover, #внешние button:hover {
    background: rgba(60, 79, 134, 0.9); border-color: #8fb6ff; color: #f2f0f6;
  }
  #внешние button { cursor: pointer; font-family: inherit; }
  #топ { border-color: rgba(255, 204, 68, 0.45) !important; color: #ffd77a !important; }
  #шкаф { border-color: rgba(108, 255, 154, 0.4) !important; color: #8ff0b0 !important; }
  #шкаф:hover { background: rgba(30, 110, 60, 0.85) !important; border-color: #6cff9a !important; color: #fff !important; }
  #топ:hover { background: rgba(150, 110, 20, 0.85) !important; border-color: #ffcc44 !important; color: #fff !important; }
  /* Твич узнают по цвету, а не по слову — поэтому у него свой акцент. */
  #твич { border-color: rgba(169, 112, 255, 0.5) !important; color: #cbb0ff !important; }
  #твич:hover { background: rgba(100, 65, 165, 0.9) !important; border-color: #a970ff !important; color: #fff !important; }
  /* На телефоне подписи короче не сделать, поэтому жмём отступы: две кнопки
     обязаны влезть в 390 px, иначе строка переносится и лезет на версию. */
  @media (max-width: 460px) {
    #внешние { gap: 8px; }
    #внешние a, #внешние button { padding: 8px 11px; font-size: 13px; }
  }
</style>
</head>
<body>
<!-- tabindex нужен, чтобы канвас мог получить фокус клавиатуры: внутри
     iframe без фокуса стрелки скроллят родительскую страницу. -->
<canvas id="экран" tabindex="0"></canvas>
<!-- Обычный HTML поверх канваса: нарисованная в канвасе кнопка не кликабельна.
     Показывается только на экранах ПОДРУБ и ИТОГИ, в бою скрыта, чтобы не ловила клики. -->
<a id="fb" href="https://t.me/ichrir" target="_blank" rel="noopener noreferrer">Есть идея или нашёл баг → @ichrir</a>
<!-- Сайт и твич Суслова. Видны только в главном меню; в бою скрыты, иначе
     ловили бы клики поверх канваса. target=_blank обязателен: игра стоит в
     рамке на чужой странице, и переход в той же вкладке выкинул бы игрока
     из игры вместе с сайтом-хозяином. -->
<div id="внешние">
  <!-- ТОП В МИРЕ открывает внутренний экран игры, поэтому это button, а не
       ссылка: канвасная кнопка потребовала бы места в колонке меню, которого
       на телефоне нет. -->
  <button id="топ" type="button">ТОП В МИРЕ</button>
  <button id="шкаф" type="button">ШКАФ</button>
  <a id="сайт" href="https://syslov171.com" target="_blank" rel="noopener noreferrer">САЙТ СУСЛОВА</a>
  <a id="твич" href="https://twitch.tv/syslov171" target="_blank" rel="noopener noreferrer">ТВИЧ</a>
</div>
<input id="ник" maxlength="14" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="твой ник">
<!-- Полный экран. Скрыта по умолчанию: показывается только на экранах, где
     уместна, и только если браузер вообще умеет Fullscreen API. -->
<button id="fs" type="button" title="На весь экран" aria-label="На весь экран">&#9974;</button>
<!-- Громкость. Панель открывается кнопкой-динамиком и живёт на всех экранах,
     включая бой: музыку чаще всего хотят убавить именно посреди забега. -->
<button id="звук" type="button" title="Громкость" aria-label="Громкость">&#9834;</button>
<div id="звукПанель">
  <div class="строка"><span>МУЗЫКА</span><span id="музыкаЗначение">45%</span></div>
  <input id="музыкаПолзунок" type="range" min="0" max="100" step="5" value="45" aria-label="Громкость музыки">
  <div class="строка"><span>ЗВУКИ</span><span id="звукиЗначение">100%</span></div>
  <input id="звукиПолзунок" type="range" min="0" max="100" step="5" value="100" aria-label="Громкость звуков">
</div>

<!-- Порядок важен: конфиги и тексты объявляют данные, engine создаёт канвас
     и состояние, entities и ui только определяют функции и работают позже.
     Обычные script src, без модулей — игра открывается двойным кликом. -->
<script src="config.js"></script>
<script src="changelog.js"></script>
<script src="text.js"></script>
<script src="content.js"></script>
<script src="sprites.js"></script>
<script src="engine.js"></script>
<script src="entities.js"></script>
<script src="ui.js"></script>
</body>
</html>
