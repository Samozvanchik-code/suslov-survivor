  const позиция = ИГРА.занятыеДонатеры.indexOf(к.ключ);
  if (позиция >= 0) ИГРА.занятыеДонатеры.splice(позиция, 1);
  if (д.применить) д.применить(и);
}

function провалитьИвент(к) {
  к.тает = 1.2;
  всплывашка(к.x, к.y - 90, к.донатер.ник + ' отписался', ЦВЕТ.текстТускл, 26);
  звук('смертьИгрока', 1.6);
  // гарнизон расходится и становится обычной толпой
  for (const в of ИГРА.враги) if (в.гарнизон === к) { в.гарнизон = null; в.спит = false; }
  const позиция = ИГРА.занятыеДонатеры.indexOf(к.ключ);
  if (позиция >= 0) ИГРА.занятыеДонатеры.splice(позиция, 1);
}

function обновитьУбегающих(дт) {
  for (let i = ИГРА.убегающие.length - 1; i >= 0; i--) {
    const у = ИГРА.убегающие[i];
    у.жизнь -= дт;
    у.фаза += дт * 10;
    if (у.машет > 0) { у.машет -= дт; }          // сперва машет, потом бежит
    else { у.x += у.вx * дт; у.y += у.вy * дт; }
    if (у.жизнь <= 0) ИГРА.убегающие.splice(i, 1);
  }
  if (ИГРА.взлетающийНик) {
    ИГРА.взлетающийНик.жизнь -= дт;
    ИГРА.взлетающийНик.y -= 70 * дт;
    if (ИГРА.взлетающийНик.жизнь <= 0) ИГРА.взлетающийНик = null;
  }
  if (ИГРА.вспышкаЭкрана > 0) ИГРА.вспышкаЭкрана -= дт * 2.2;
  if (ИГРА.отложенныйЛевелап > 0) {
    ИГРА.отложенныйЛевелап -= дт;
    if (ИГРА.отложенныйЛевелап <= 0) продолжитьОчередьЛевелапов();
  }
}

// Призрачный режим от haunted
function обновитьПризрака(дт) {
  const и = ИГРА.игрок;
  if (!и.призракОткрыт) return;
  if (и.призрак > 0) { и.призрак -= дт; return; }
  и.таймерПризрака -= дт;
  if (и.таймерПризрака <= 0) {
    и.таймерПризрака = ПРИЗРАК.перезарядка;
    и.призрак = ПРИЗРАК.длительность;
    всплывашка(и.x, и.y - и.в - 20, 'haunted', '#b98ce0', 22);
  }
}


/* ==========================================================================
   БЛОК 12. ИГРОК
   ========================================================================== */

function обновитьИгрока(дт) {
  const и = ИГРА.игрок;

  let дx = 0, дy = 0;
  if (джойстик.активен && (джойстик.дx || джойстик.дy)) {
    дx = джойстик.дx; дy = джойстик.дy;
  } else {
    if (клавиши['KeyA'] || клавиши['ArrowLeft'])  дx -= 1;
    if (клавиши['KeyD'] || клавиши['ArrowRight']) дx += 1;
    if (клавиши['KeyW'] || клавиши['ArrowUp'])    дy -= 1;
    if (клавиши['KeyS'] || клавиши['ArrowDown'])  дy += 1;
  }

  и.идёт = (дx !== 0 || дy !== 0);
  let скорость = ГЕРОЙ.скорость * и.множительСкорости * (и.праймОсталось > 0 ? 2 : 1);

  // Режим Шварца: вдвое быстрее и втрое злее, но управление пьяное и hp тикает
  if (и.шварц > 0) {
    и.шварц -= дт;
    скорость *= ЧЕРЕП.скорость;
    и.таймерШварцаHp -= дт;
    if (и.таймерШварцаHp <= 0) {
      и.таймерШварцаHp = ЧЕРЕП.тикHp;
      и.hp -= 1;
      всплывашка(и.x, и.y - и.в - 10, '-1', ЦВЕТ.урон, 20);
      if (и.hp <= 0) { и.hp = 0; завершитьЗабег(); return; }
    }
    if (и.шварц <= 0) всплывашка(и.x, и.y - 120, 'отпустило', ЦВЕТ.текстТускл, 24);
  }

  // рывок по Shift открывается третьим уровнем НОЖЕК-СПИЧЕК
  if (и.рывокКулдаун > 0) и.рывокКулдаун -= дт;
  if (и.рывокОсталось > 0) { и.рывокОсталось -= дт; скорость *= 3; }
  else if (и.рывокОткрыт && и.рывокКулдаун <= 0 && и.идёт &&
           (клавиши['ShiftLeft'] || клавиши['ShiftRight'])) {
    и.рывокОсталось = 0.16; и.рывокКулдаун = 2.2;
    брызги(и.x, и.y, '#c9c4d6', 6);
  }

  if (и.идёт) {
    const д = Math.hypot(дx, дy);
    дx /= д; дy /= д;
    и.напрX = дx; и.напрY = дy;
  }

  if (и.шварц > 0) {
    // пьяное управление: заносит, мгновенно не тормозит
    const к = 1 - Math.pow(0.5, дт * ЧЕРЕП.инерция);
    и.вx += ((и.идёт ? дx * скорость : 0) - и.вx) * к;
    и.вy += ((и.идёт ? дy * скорость : 0) - и.вy) * к;
  } else {
    и.вx = и.идёт ? дx * скорость : 0;
    и.вy = и.идёт ? дy * скорость : 0;
  }
  и.x += и.вx * дт;
  и.y += и.вy * дт;

  const темп = Math.hypot(и.вx, и.вy);
  if (темп > 6) {
    и.фаза += дт * (темп / 40);
    if (и.вx !== 0) и.сторона = и.вx > 0 ? 1 : -1;
  } else {
    и.фаза *= Math.pow(0.02, дт);      // стоит на месте — фаза шагов затухает
  }

  if (и.неуязвим > 0) и.неуязвим -= дт;
  if (и.вспышка > 0) и.вспышка -= дт;
}

function ранитьИгрока(урон, источник) {
  const и = ИГРА.игрок;
  if (и.неуязвим > 0) return;
  if (и.призрак > 0) return;                 // призрачный режим от haunted

  if (и.щитЗаряжен) {              // БЕЗ ТРЕША глотает удар целиком
    и.щитЗаряжен = false;
    и.неуязвим = ГЕРОЙ.неуязвимость;
    всплывашка(и.x, и.y - и.в - 10, 'без треша', ЦВЕТ.крик, 20);
    звук('крик', 1.4);
    return;
  }

  let итог = урон * (1 - и.броня);
  и.hp -= итог;
  и.неуязвим = ГЕРОЙ.неуязвимость;
  и.вспышка = 0.14;
  ИГРА.тряска = Math.max(ИГРА.тряска, 8);
  брызги(и.x, и.y - и.в * 0.5, ЦВЕТ.урон, 10);
  всплывашка(и.x, и.y - и.в - 10, '-' + (Math.round(итог * 10) / 10), ЦВЕТ.урон, 22);
  звук('урон');

  if (и.отражает > 0 && источник && !источник.мёртв) {
    уронВрагу(источник, урон * и.отражает * 4, источник.x, источник.y);
  }
  if (и.hp <= 0) { и.hp = 0; завершитьЗабег(); }
}

function завершитьЗабег() {
  ИГРА.новыйРекорд = сохранитьРекорд(ИГРА.время);
  отправитьРезультат({
    ник: текущийНик(),
    время: Math.round(ИГРА.время * 10) / 10,
    уровень: ИГРА.уровень,
    спасённых: ИГРА.спасённые.length,
    дата: Date.now()
  });
  ИГРА.экран = 'итоги';
  ИГРА.тряска = 12;
  звук('смертьИгрока');
}


/* ==========================================================================
   БЛОК 13. ЛЕВЕЛАП И КАРТОЧКИ
   ========================================================================== */

function доступныеАпгрейды() {
  const и = ИГРА.игрок;
  return АПГРЕЙДЫ.filter(а => (и.апгрейды[а.ид] || 0) < а.макс);
}

function открытьЛевелап() {
  const и = ИГРА.игрок;

  // За один подбор кристалла можно перескочить сразу через два уровня.
  // Тогда карточки не перезаписываем, а ставим второй выбор в очередь.
  if (ИГРА.экран === 'левелап') { ИГРА.очередьЛевелапов++; return; }

  /* Кадр спасения карточками не перебиваем: веер кристаллов от донатера
     почти всегда даёт уровень, и меню закрыло бы собой ровно тот момент,
     ради которого весь ивент и затевался. */
  if (ИГРА.взлетающийНик) {
    ИГРА.очередьЛевелапов++;
    ИГРА.отложенныйЛевелап = Math.max(ИГРА.отложенныйЛевелап, 1.3);
    return;
  }

  const пул = доступныеАпгрейды();
  if (пул.length === 0) return;

  // ЛЮКС повышает шанс, что в раздачу попадут редкие карточки
  const выбранные = [];
  const копия = пул.slice();
  while (выбранные.length < 3 && копия.length > 0) {
    let индекс;
    const хочуРедкую = Math.random() < зажать(0.2 + и.шансРедкой, 0, 0.9);
    const редкие = копия.map((а, n) => а.редкая ? n : -1).filter(n => n >= 0);
    if (хочуРедкую && редкие.length > 0) индекс = изМассива(редкие);
    else индекс = Math.floor(Math.random() * копия.length);
    выбранные.push(копия.splice(индекс, 1)[0]);
  }

  ИГРА.карточки = выбранные.map(а => ({
    апгрейд: а,
    новыйУровень: (и.апгрейды[а.ид] || 0) + 1
  }));
  ИГРА.экран = 'левелап';
  звук('левелап');
}

function взятьКарточку(индекс) {
  const карта = ИГРА.карточки[индекс];
  if (!карта) return;
  const и = ИГРА.игрок;
  const а = карта.апгрейд;
  и.апгрейды[а.ид] = (и.апгрейды[а.ид] || 0) + 1;
  if (а.применить) а.применить(и);

  // только что открытое оружие должно сработать быстро, а не через полный откат
  if (а.ид === 'krik'   && и.апгрейды.krik   === 1) и.таймерКрика  = 0.6;
  if (а.ид === 'otchet' && и.апгрейды.otchet === 1) и.таймерОтчёта = 2.0;
  if (а.ид === 'praim'  && и.апгрейды.praim  === 1) и.таймерПрайма = 8.0;
  if (а.ид === 'zdravo') и.таймерРегена = и.регенИнтервал;
  if (а.ид === 'beztresha' && !и.щитЗаряжен) { и.щитЗаряжен = true; и.таймерЩита = и.щитИнтервал; }

  ИГРА.карточки = [];
  всплывашка(и.x, и.y - и.в - 40, а.имя, ЦВЕТ.золото, 26);

  // взяли четвёртого пацана — сперва надо кого-то отпустить
  if (ИГРА.заменаНа) { ИГРА.экран = 'замена'; return; }

  ИГРА.экран = 'бой';
  продолжитьОчередьЛевелапов();
}

// остались невыбранные уровни — сразу показываем следующую раздачу
function продолжитьОчередьЛевелапов() {
  if (ИГРА.очередьЛевелапов > 0) {
    ИГРА.очередьЛевелапов--;
    открытьЛевелап();
  }
}


/* ==========================================================================
   БЛОК 14. КАМЕРА
   ========================================================================== */

function обновитьКамеру(дт) {
  const и = ИГРА.игрок;
  const целx = и.x - ЭКР.ш / 2;
  const целy = (и.y - и.в * 0.4) - ЭКР.в / 2;
  const к = 1 - Math.pow(0.0005, дт);       // кадронезависимое сглаживание
  ИГРА.камера.x += (целx - ИГРА.камера.x) * к;
  ИГРА.камера.y += (целy - ИГРА.камера.y) * к;
  if (ИГРА.тряска > 0) {
    ИГРА.тряска -= дт * 26;
    if (ИГРА.тряска < 0) ИГРА.тряска = 0;
  }
}


/* ==========================================================================
   БЛОК 15. ОТРИСОВКА МИРА
   ========================================================================== */

/* Пол печём один раз в офскрин-холст и дальше кладём паттерном.
   Иначе каждый кадр уходило ~600 отдельных заливок только на крапины,
   а при 200+ врагах на экране этот бюджет нужен на спрайты.
   Блок 4x4 клетки: шахматка при чётном размере блока стыкуется без шва. */
const ПЛИТКА = 128, БЛОК = 4, ПЕРИОД = ПЛИТКА * БЛОК;
let полПаттерн = null;

function построитьПол() {
  const холст = document.createElement('canvas');
  холст.width = холст.height = ПЕРИОД;
  const к = холст.getContext('2d');
  for (let тx = 0; тx < БЛОК; тx++) {
    for (let тy = 0; тy < БЛОК; тy++) {
      к.fillStyle = ((тx + тy) & 1) ? ЦВЕТ.полСветлый : ЦВЕТ.полТёмный;
      к.fillRect(тx * ПЛИТКА, тy * ПЛИТКА, ПЛИТКА, ПЛИТКА);
      к.fillStyle = ЦВЕТ.крапина;
      for (let с = 0; с < 5; с++) {
        const рx = хеш(тx * 7 + с, тy * 13), рy = хеш(тx * 13, тy * 7 + с);
        const р = 1 + хеш(тx + с, тy) * 2;
        к.fillRect(тx * ПЛИТКА + рx * ПЛИТКА, тy * ПЛИТКА + рy * ПЛИТКА, р, р);
      }
    }
  }
  полПаттерн = кт.createPattern(холст, 'repeat');
}

function нарисоватьПол(кx, кy) {
  if (!полПаттерн) построитьПол();
  const сдвигX = -(((кx % ПЕРИОД) + ПЕРИОД) % ПЕРИОД);
  const сдвигY = -(((кy % ПЕРИОД) + ПЕРИОД) % ПЕРИОД);
  кт.save();
  кт.translate(сдвигX, сдвигY);
  кт.fillStyle = полПаттерн;
  кт.fillRect(0, 0, ЭКР.ш - сдвигX + ПЕРИОД, ЭКР.в - сдвигY + ПЕРИОД);
  кт.restore();
}

/* Кристалл со свечением — один запечённый канвас. Их на экране бывает под
   сотню, и отдельная заливка свечения на каждый обходится дороже самого блита. */
let холстКристалла = null;
function готовыйКристалл() {
  if (холстКристалла) return холстКристалла;
  const г = габариты('item_xp');
  const с = СПРАЙТ.item_xp;
  const ш = Math.ceil(г.ш) + 8, в = Math.ceil(г.в) + 8;
  const холст = document.createElement('canvas');
  холст.width = ш; холст.height = в;
  const к = холст.getContext('2d');
  к.imageSmoothingEnabled = true;
  к.imageSmoothingQuality = 'high';
  к.globalAlpha = 0.35;
  к.fillStyle = ЦВЕТ.опыт;
  к.beginPath();
  к.ellipse(ш / 2, в / 2 + г.в * 0.15, г.ш * 0.5, г.ш * 0.22, 0, 0, Math.PI * 2);
  к.fill();
  к.globalAlpha = 1;
  if (с && с.готов) к.drawImage(с.картинка, (ш - г.ш) / 2, (в - г.в) / 2, г.ш, г.в);
  else { к.fillStyle = ЦВЕТ.опыт; к.fillRect(ш / 2 - 5, в / 2 - 7, 10, 14); }
  холстКристалла = { холст, полуШ: ш / 2, полуВ: в / 2 };
  return холстКристалла;
}

function нарисоватьКристалл(к, кx, кy) {
  const г = готовыйКристалл();
  const парение = Math.sin(к.фаза) * 3;
  кт.drawImage(г.холст, (к.x - кx - г.полуШ) | 0, (к.y - кy + парение - г.полуВ) | 0);
}

function нарисоватьГантелю(гн, кx, кy) {
  const г = габариты('weapon_gantelya');
  const с = СПРАЙТ.weapon_gantelya;
  кт.save();
  кт.translate(гн.x - кx, гн.y - кy);
  кт.rotate(гн.поворот);
  const готовый = готовыйСпрайт('weapon_gantelya', 1, 1, null);
  if (готовый) кт.drawImage(готовый.холст, -готовый.ш / 2, -готовый.в / 2, готовый.ш, готовый.в);
  else { кт.fillStyle = '#3a3a44'; кт.fillRect(-г.ш / 2, -г.в / 6, г.ш, г.в / 3); }
  кт.restore();
}

/* Горячий путь: враг рисуется без единого выделения памяти, без строковых
   ключей и без save/restore. Поза достаётся прямым индексом из таблицы,
   тень уже внутри канваса — то есть один drawImage на врага. */
/* Уникальные враги (боссы) мимо предрендера: у ТОЛПЫ масштаб плавно едет
   по мере потери кусков, под это одна запечённая копия не годится.
   Их на экране один-два, так что обычный drawImage с масштабированием
   ничего не стоит. */
function нарисоватьУникального(в, кx, кy) {
  const с = СПРАЙТ[в.шаблон.спрайт];
  const г = габариты(в.шаблон.спрайт, в.масштаб, в.шаблон.ширинаX);
  const x = в.x - кx, y = в.y - кy;
  const подпрыг = Math.abs(Math.sin(в.фаза)) * 4;
  const колыхание = Math.sin(в.фаза * 0.7) * 0.02;   // туша слегка колышется

  кт.save();
  кт.globalAlpha = 0.34;
  кт.fillStyle = '#000000';
  кт.beginPath();
  кт.ellipse(x, y, г.ш * 0.34, г.ш * 0.12, 0, 0, ДВА_ПИ);
  кт.fill();
  кт.restore();

  if (!с || !с.готов) return;
  кт.save();
  кт.translate(x, y - подпрыг);
  кт.rotate(колыхание);
  кт.scale(в.сторона === -1 ? -1 : 1, 1);
  кт.drawImage(с.картинка, -г.ш / 2, -г.в, г.ш, г.в);
  if (в.вспышка > 0) {
    кт.globalAlpha = зажать(в.вспышка * 8, 0, 0.8);
    кт.globalCompositeOperation = 'source-atop';
    кт.fillStyle = '#ffffff';
    кт.fillRect(-г.ш / 2, -г.в, г.ш, г.в);
  }
  кт.restore();
}

function нарисоватьВрага(в, кx, кy) {
  const ш = в.шаблон;
  if (ш.уникальный) { нарисоватьУникального(в, кx, кy); return; }
  const норм = ((в.фаза % ДВА_ПИ) + ДВА_ПИ) % ДВА_ПИ;
  const индекс = (норм / ДВА_ПИ * ПОЗ) | 0;
  const влево = в.сторона === -1;

  const поза = (влево ? ш._база.лев : ш._база.прав)[индекс];
  if (!поза) return;
  const пx = (в.x - кx - поза.якорьX) | 0;
  const пy = (в.y - кy - поза.якорьY) | 0;

  const альфа = в.гаснет > 0 ? в.гаснет / ЗАТУХАНИЕ : 1;
  if (альфа !== 1) кт.globalAlpha = альфа;
  кт.drawImage(поза.холст, пx, пy);

  if (в.вспышка > 0) {
    const с = (влево ? ш._белые.лев : ш._белые.прав)[индекс];
    кт.globalAlpha = зажать(в.вспышка * 8, 0, 0.85) * альфа;
    кт.drawImage(с.холст, пx, пy);
    кт.globalAlpha = 1;
  } else if (ш._оттенок) {
    // трещина делителя и табличка маски уже в спрайтах,
    // кодом осталась только пульсация каминг-аута. На замахе она
    // разгоняется до предела — это и есть предупреждение о взрыве.
    const с = (влево ? ш._оттенок.лев : ш._оттенок.прав)[индекс];
    let сила;
    if (в.замах > 0) {
      const близко = 1 - в.замах / КАМИНГ.замах;              // 0 в начале, 1 перед взрывом
      const частота = 10 + близко * 40;                        // мигает всё чаще
      сила = 0.25 + близко * 0.5 + Math.abs(Math.sin(в.замах * частота)) * 0.35;
    } else {
      сила = 0.05 + Math.abs(Math.sin(в.фаза * 2)) * 0.18;
    }
    кт.globalAlpha = зажать(сила, 0, 1) * альфа;
    кт.drawImage(с.холст, пx, пy);
    кт.globalAlpha = 1;
  } else if (альфа !== 1) {
    кт.globalAlpha = 1;
  }

  // кольцо радиуса подрыва: видно, куда именно прилетит
  if (в.замах > 0) {
    const близко = 1 - в.замах / КАМИНГ.замах;
    кт.save();
    кт.globalAlpha = 0.25 + близко * 0.45;
    кт.strokeStyle = '#ff7a45';
    кт.lineWidth = 2 + близко * 2;
    кт.beginPath();
    кт.ellipse(в.x - кx, в.y - кy, КАМИНГ.радиус * (0.35 + близко * 0.65),
               КАМИНГ.радиус * (0.35 + близко * 0.65) * 0.42, 0, 0, ДВА_ПИ);
    кт.stroke();
    кт.restore();
  }

  // кусок ТОЛПЫ ещё встаёт: пыль под ногами, чтобы читалось «поднимается»
  if (в.встаёт > 0) {
    кт.save();
    кт.globalAlpha = зажать(в.встаёт / КУСОК.вставание, 0, 1) * 0.5;
    кт.fillStyle = '#b6b1c4';
    кт.beginPath();
    кт.ellipse(в.x - кx, в.y - кy, 26 * (1.2 - в.встаёт / КУСОК.вставание), 8, 0, 0, ДВА_ПИ);
    кт.fill();
    кт.restore();
  }

  // полоска hp только у раненых — иначе экран превращается в кашу
  if (в.hp < в.максHp && в.гаснет <= 0) {
    const шп = в.ширинаСпрайта > 37 ? в.ширинаСпрайта * 0.7 : 26;
    const y = в.y - кy - в.высотаСпрайта - 10;
    const x = в.x - кx - шп / 2;
    кт.fillStyle = 'rgba(0,0,0,0.6)';
    кт.fillRect(x, y, шп, 5);
    кт.fillStyle = ЦВЕТ.хп;
    кт.fillRect(x, y, шп * (в.hp > 0 ? в.hp / в.максHp : 0), 5);
  }
}

function нарисоватьИгрока(кx, кy) {
  const и = ИГРА.игрок;
  const мигает = и.неуязвим > 0 && Math.floor(и.неуязвим * 18) % 2 === 0;

  /* Постоянное тонкое кольцо под Ильёй. Со свитой из союзников, тараканов
     и щенков игрок теряется в толпе — взгляд должен находить себя мгновенно. */
  кт.save();
  кт.beginPath();
  кт.ellipse(и.x - кx, и.y - кy, 34, 14, 0, 0, ДВА_ПИ);
  кт.globalAlpha = 0.18;
  кт.fillStyle = '#eef3ff';
  кт.fill();
  кт.globalAlpha = 0.28;                       // мягкая внешняя подложка
  кт.strokeStyle = '#eef3ff';
  кт.lineWidth = 6;
  кт.stroke();
  кт.globalAlpha = 0.85;                       // чёткий тонкий контур
  кт.lineWidth = 2;
  кт.stroke();
  кт.restore();

  // аура ПРАЙМА под ногами
  if (и.праймОсталось > 0) {
    кт.save();
    кт.globalAlpha = 0.25 + Math.sin(ИГРА.времяВсего * 8) * 0.1;
    кт.fillStyle = ЦВЕТ.золото;
    кт.beginPath();
    кт.ellipse(и.x - кx, и.y - кy, 54, 20, 0, 0, Math.PI * 2);
    кт.fill();
    кт.restore();
  }
  // щит БЕЗ ТРЕША
  if (и.щитЗаряжен) {
    кт.save();
    кт.globalAlpha = 0.5;
    кт.strokeStyle = ЦВЕТ.крик; кт.lineWidth = 2.5;
    кт.beginPath();
    кт.ellipse(и.x - кx, и.y - кy - и.в * 0.45, 42, 62, 0, 0, Math.PI * 2);
    кт.stroke();
    кт.restore();
  }

  drawSprite(и.шварц > 0 ? 'shvarts' : 'ilya_idle', и.x - кx, и.y - кy, {
    фаза: и.фаза, идёт: и.идёт, сторона: и.сторона,
    вспышка: и.вспышка, альфа: мигает ? 0.35 : 1
  });

  // Пока нет спрайтов-слоёв прокачки, ОЧКИ отражаем свечением.
  const ур = и.апгрейды.ochki || 0;
  if (ур >= 3) {
    const г = габариты('ilya_idle');
    кт.save();
    кт.globalAlpha = 0.55;
    кт.fillStyle = ур >= 4 ? '#5cff9a' : '#bfe9ff';
    кт.beginPath();
    кт.ellipse(и.x - кx + (и.сторона * 2), и.y - кy - г.в * 0.86, 9, 3.5, 0, 0, Math.PI * 2);
    кт.fill();
    кт.restore();
  }
}

function нарисоватьПузыри(кx, кy) {
  for (const п of ИГРА.пузыри) {
    const ц = п.цель;
    if (!ц) continue;
    let x, y;
    if (п.цельТип === 'игрок') {
      x = ц.x - кx; y = ц.y - кy - габариты('ilya_idle').в - 22;
    } else {
      x = ц.x - кx; y = ц.y - кy - ц.высотаСпрайта - 16;
    }
    if (x < -200 || x > ЭКР.ш + 200 || y < -100 || y > ЭКР.в + 100) continue;

    const появление = зажать((п.всего - п.жизнь) * 6, 0, 1);
    const исчезание = зажать(п.жизнь * 3, 0, 1);
    кт.save();
    кт.globalAlpha = появление * исчезание;

    const размер = 17;
    const ш = ширинаТекста(п.строка, размер, '700') + 22;
    const в = размер + 16;
    кт.fillStyle = 'rgba(18,16,24,0.9)';
    кт.strokeStyle = 'rgba(210,205,225,0.35)';
    кт.lineWidth = 1.5;
    скруглённыйПрямоугольник(x - ш / 2, y - в, ш, в, 9);
    кт.fill(); кт.stroke();
    // хвостик пузыря
    кт.beginPath();
    кт.moveTo(x - 6, y); кт.lineTo(x + 6, y); кт.lineTo(x, y + 8);
    кт.closePath(); кт.fill();

    текст(п.строка, x, y - в / 2, {
      размер, вес: '700', выравн: 'center', базовая: 'middle',
      цвет: '#e8e4f2', обводка: false
    });
    кт.restore();
  }
}

// Переиспользуемые между кадрами, чтобы не мусорить в куче.
const порядок = [];
const поY = (a, b) => a._сорт - b._сорт;

function нарисоватьТаракана(т, кx, кy) {
  const ур = уровеньСвиты('tarakany');
  const к = ТАРАКАНЫ.уровни[ур - 1];
  if (!к) return;
  const ключ = к.тараканище ? 'pet_tarakanische' : 'pet_tarakan';
  drawSprite(ключ, т.x - кx, т.y - кy, {
    фаза: т.фаза, идёт: true, сторона: т.сторона
  });
}

function нарисоватьЩенка(щ, кx, кy) {
  if (щ.выбыл > 0) return;
  drawSprite('pet_schenok', щ.x - кx, щ.y - кy, {
    фаза: щ.фаза, идёт: true, сторона: щ.сторона
  });
  if (щ.hp < щ.максHp) {
    const ш = 30, y = щ.y - кy - 46;
    кт.fillStyle = 'rgba(0,0,0,0.6)'; кт.fillRect(щ.x - кx - ш/2, y, ш, 4);
    кт.fillStyle = '#8fd06a'; кт.fillRect(щ.x - кx - ш/2, y, ш * зажать(щ.hp/щ.максHp,0,1), 4);
  }
}

/* Ник над союзником — это весь смысл механики, ради узнавания всё и затевалось.
   Мелкий шрифт с полупрозрачной подложкой, чтобы читалось поверх любой мешанины. */
function нарисоватьНик(ник, x, y) {
  const размер = 14;
  const ш = ширинаТекста(ник, размер, '700') + 12;
  const в = размер + 8;
  кт.save();
  кт.fillStyle = 'rgba(14,12,20,0.72)';
  скруглённыйПрямоугольник(x - ш / 2, y - в, ш, в, 5);
  кт.fill();
  кт.restore();
  текст(ник, x, y - в / 2, {
    размер, вес: '700', выравн: 'center', базовая: 'middle',
    цвет: '#e9e4f4', толщинаОбводки: 3
  });
}

function нарисоватьСоюзника(с, кx, кy) {
  const к = с.конфиг;
  drawSprite(к.спрайт, с.x - кx, с.y - кy, {
    фаза: с.фаза, идёт: true, сторона: с.сторона
  });
  const г = габариты(к.спрайт, 1, 1);
  // танк показывает, сколько ещё продержится
  if (к.роль === 'танк' && с.hp < с.максHp) {
    const ш = 46, y = с.y - кy - г.в - 26;
    кт.fillStyle = 'rgba(0,0,0,0.6)'; кт.fillRect(с.x - кx - ш/2, y, ш, 5);
    кт.fillStyle = '#5aa0e0'; кт.fillRect(с.x - кx - ш/2, y, ш * зажать(с.hp/с.максHp,0,1), 5);
  }
  нарисоватьНик(к.ник, с.x - кx, с.y - кy - г.в - 8);
}

function нарисоватьМир() {
  const тx = ИГРА.тряска > 0 ? случ(-ИГРА.тряска, ИГРА.тряска) : 0;
  const тy = ИГРА.тряска > 0 ? случ(-ИГРА.тряска, ИГРА.тряска) : 0;
  const кx = ИГРА.камера.x + тx, кy = ИГРА.камера.y + тy;

  нарисоватьПол(кx, кy);

  for (const к of ИГРА.кристаллы) {
    if (наЭкране(к.x, к.y, 60)) нарисоватьКристалл(к, кx, кy);
  }

  // Сортировка по Y: кто ниже — тот ближе к камере и рисуется поверх.
  // Массив переиспользуем, чтобы не выделять его заново каждый кадр.
  порядок.length = 0;
  const враги = ИГРА.враги;
  for (let i = 0; i < враги.length; i++) {
    const в = враги[i];
    if (наЭкране(в.x, в.y, 220)) { в._сорт = в.y; в._вид = 0; порядок.push(в); }
  }
  const и = ИГРА.игрок;
  /* Свита сортируется по глубине вместе с врагами, но её ключ подрезан по
     игроку: спутник никогда не рисуется поверх Ильи, даже стоя ниже него. */
  const потолокСвиты = и.y - 0.5;
  for (const т of ИГРА.тараканы) {
    if (!наЭкране(т.x, т.y, 120)) continue;
    т._сорт = Math.min(т.y, потолокСвиты); т._вид = 1; порядок.push(т);
  }
  for (const щ of ИГРА.щенки) {
    if (щ.выбыл > 0 || !наЭкране(щ.x, щ.y, 120)) continue;
    щ._сорт = Math.min(щ.y, потолокСвиты); щ._вид = 2; порядок.push(щ);
  }
  for (const с of ИГРА.союзники) {
    if (!наЭкране(с.x, с.y, 200)) continue;
    с._сорт = Math.min(с.y, потолокСвиты); с._вид = 3; порядок.push(с);
  }
  и._сорт = и.y; и._вид = 4;
  порядок.push(и);
  порядок.sort(поY);

  for (const о of порядок) {
    switch (о._вид) {
      case 0: нарисоватьВрага(о, кx, кy); break;
      case 1: нарисоватьТаракана(о, кx, кy); break;
      case 2: нарисоватьЩенка(о, кx, кy); break;
      case 3: нарисоватьСоюзника(о, кx, кy); break;
      default: нарисоватьИгрока(кx, кy);
    }
  }

  // аура zzord: видно, где аноны вязнут
  const аура = ИГРА.аураЗамедления;
  if (аура) {
    кт.save();
    кт.globalAlpha = 0.16;
    кт.strokeStyle = '#7fd6e8'; кт.lineWidth = 3;
    кт.beginPath();
    кт.ellipse(аура.x - кx, аура.y - кy, аура.радиус, аура.радиус * 0.45, 0, 0, ДВА_ПИ);
    кт.stroke();
    кт.restore();
  }

  // пули снайпера
  for (const в of ИГРА.выстрелы) {
    кт.save();
    кт.fillStyle = '#dff0ff';
    кт.beginPath(); кт.arc(в.x - кx, в.y - кy, 4, 0, ДВА_ПИ); кт.fill();
    кт.globalAlpha = 0.4;
    кт.beginPath(); кт.arc(в.x - кx, в.y - кy, 8, 0, ДВА_ПИ); кт.fill();
    кт.restore();
  }

  // --- клетка донатера ---
  const кл = ИГРА.клетка;
  if (кл) {
    const альфа = кл.тает > 0 ? зажать(кл.тает / 1.2, 0, 1) : 1;
    const x = кл.x - кx, y = кл.y - кy;

    // круг взлома на земле
    кт.save();
    кт.globalAlpha = (кл.взламывается ? 0.55 : 0.25) * альфа;
    кт.strokeStyle = кл.взламывается ? '#6cff9a' : '#8fb6ff';
    кт.lineWidth = 3;
    кт.setLineDash([14, 10]);
    кт.lineDashOffset = -кл.фаза * 14;
    кт.beginPath();
    кт.ellipse(x, y, ИВЕНТ.радиусВзлома, ИВЕНТ.радиусВзлома * 0.45, 0, 0, ДВА_ПИ);
    кт.stroke();
    кт.restore();

    const гк = готовыйСпрайт('obj_kletka', 1.7, 1, null);
    if (гк) {
      кт.save();
      кт.globalAlpha = альфа;
      кт.drawImage(гк.холст, (x - гк.ш / 2) | 0, (y - гк.в) | 0);
      кт.restore();
    }

    // Полоска взлома НАД КЛЕТКОЙ, а не в интерфейсе: взгляд игрока
    // в этот момент прикован к своему персонажу и к клетке.
    if (кл.прогресс > 0 && кл.тает <= 0) {
      const ш = 150, в = 16;
      const пy = y - (гк ? гк.в : 90) - 34;
      полоска(x - ш / 2, пy, ш, в, кл.прогресс / ИВЕНТ.времяВзлома,
              кл.взламывается ? '#6cff9a' : '#c9a227', '#1d2a22', 5);
      текст('ВЗЛОМ', x, пy - 18, { размер: 15, выравн: 'center', цвет: ЦВЕТ.текстТускл });
    }

    // ник донатера над клеткой
    if (кл.тает <= 0) {
      нарисоватьНик(кл.донатер.ник, x, y - (гк ? гк.в : 90) - (кл.прогресс > 0 ? 56 : 12));
    }
  }

  // --- убегающие донатеры ---
  for (const у of ИГРА.убегающие) {
    const качание = у.машет > 0 ? Math.sin(у.фаза) * 0.25 : 0;
    кт.save();
    кт.globalAlpha = зажать(у.жизнь / 1.2, 0, 1);
    кт.translate(у.x - кx, у.y - кy);
    кт.rotate(качание);
    кт.scale(у.сторона, 1);
    const г = габариты(у.спрайт, 1, 1);
    const с = СПРАЙТ[у.спрайт];
    if (с && с.готов) кт.drawImage(с.картинка, -г.ш / 2, -г.в, г.ш, г.в);
    кт.restore();
  }

  // лут на карте
  for (const п of ИГРА.предметы) {
    const ключ = п.вид === 'cherep' ? 'item_cherep' : 'item_beluga';
    const гп = готовыйСпрайт(ключ, 1, 1, null);
    const парение = Math.sin(п.фаза) * 5;
    кт.save();
    кт.globalAlpha = 0.3;
    кт.fillStyle = '#6cff9a';
    кт.beginPath();
    кт.ellipse(п.x - кx, п.y - кy, 26, 10, 0, 0, ДВА_ПИ);
    кт.fill();
    кт.restore();
    if (гп) кт.drawImage(гп.холст, (п.x - кx - гп.ш / 2) | 0, (п.y - кy - гп.в - парение) | 0);
  }

  // ОЧКИ на максимуме — видно врагов сквозь толпу
  if (и.видитСквозьТолпу) {
    кт.save();
    кт.globalAlpha = 0.5; кт.strokeStyle = '#5cff9a'; кт.lineWidth = 2;
    for (const в of порядок) {
      if (в === и) continue;
      кт.beginPath();
      кт.ellipse(в.x - кx, в.y - кy, в.ш * 0.5, в.ш * 0.22, 0, 0, Math.PI * 2);
      кт.stroke();
    }
    кт.restore();
  }

  // куски ТОЛПЫ в полёте: летят по дуге, вращаясь
  for (const к of ИГРА.куски) {
    const t = зажать(к.t, 0, 1);
    const x = к.отX + (к.доX - к.отX) * t;
    const назем = к.отY + (к.доY - к.отY) * t;
    const дуга = Math.sin(Math.PI * t) * КУСОК.высотаДуги;
    const готовый = готовыйСпрайт('anon', 0.5, 1, null);
    кт.save();
    кт.globalAlpha = 0.32;
    кт.fillStyle = '#000000';
    кт.beginPath();
    кт.ellipse(x - кx, назем - кy, 14 * (1 - дуга / (КУСОК.высотаДуги * 1.6)), 5, 0, 0, ДВА_ПИ);
    кт.fill();
    кт.restore();
    if (готовый) {
      кт.save();
      кт.translate(x - кx, назем - дуга - кy - готовый.в / 2);
      кт.rotate(к.поворот);
      кт.drawImage(готовый.холст, -готовый.ш / 2, -готовый.в / 2);
      кт.restore();
    }
  }

  for (const гн of ИГРА.гантели) нарисоватьГантелю(гн, кx, кy);

  // кольца КРИКа
  for (const к of ИГРА.кольца) {
    кт.save();
    кт.globalAlpha = зажать(к.жизнь / к.всего, 0, 1) * 0.85;
    кт.strokeStyle = к.цвет || ЦВЕТ.крик;
    кт.lineWidth = 7 * (к.жизнь / к.всего) + 2;
    кт.beginPath();
    кт.ellipse(к.x - кx, к.y - кy, к.r, к.r * 0.42, 0, 0, Math.PI * 2);
    кт.stroke();
    кт.restore();
  }

  // частицы
  for (const ч of ИГРА.частицы) {
    кт.globalAlpha = зажать(ч.жизнь / ч.всего, 0, 1);
    кт.fillStyle = ч.цвет;
    кт.fillRect(ч.x - кx - ч.размер / 2, ч.y - кy - ч.размер / 2, ч.размер, ч.размер);
  }
  кт.globalAlpha = 1;

  нарисоватьПузыри(кx, кy);

  // всплывающие цифры
  for (const в of ИГРА.всплывашки) {
    кт.globalAlpha = зажать(в.жизнь / в.всего * 1.5, 0, 1);
    текст(в.строка, в.x - кx, в.y - кy, {
      размер: в.размер, цвет: в.цвет, выравн: 'center', базовая: 'middle'
    });
  }
  кт.globalAlpha = 1;
}


/* ==========================================================================
   БЛОК 16. ИНТЕРФЕЙС БОЯ
   ========================================================================== */

function форматВремени(сек) {
  const м = Math.floor(сек / 60), с = Math.floor(сек % 60);
  return м + ':' + (с < 10 ? '0' : '') + с;
}

function полоска(x, y, ш, в, доля, цвет, фон, r = 5) {
  кт.fillStyle = фон;
  скруглённыйПрямоугольник(x, y, ш, в, r); кт.fill();
  const д = зажать(доля, 0, 1);
  if (д > 0) {
    кт.save();
    скруглённыйПрямоугольник(x, y, ш, в, r); кт.clip();
    кт.fillStyle = цвет;
    кт.fillRect(x, y, ш * д, в);
    кт.restore();
  }
  кт.strokeStyle = 'rgba(0,0,0,0.55)'; кт.lineWidth = 2;
  скруглённыйПрямоугольник(x, y, ш, в, r); кт.stroke();
}

// Иконка апгрейда: спрайт, если он есть, иначе цветной кружок с буквой.
const ЦВЕТА_ИКОНОК = {
  'крик':'#4aa8d8', 'отчёт':'#c9a227', 'прайм':'#e0913a', 'здраво':'#4fb36a',
  'мышление':'#8a6ad8', 'щит':'#4a86c4', 'люкс':'#c98fd8', 'подруб':'#d85a5a',
  'ноги':'#b0784a', 'очки':'#5ec8e0', 'атлет':'#d05050', 'причёска':'#d8c060'
};

function нарисоватьИконку(ключ, x, y, размер) {
  if (СПРАЙТ[ключ] && СПРАЙТ[ключ].готов) {
    const с = СПРАЙТ[ключ];
    const к = размер / Math.max(с.ш, с.в);
    кт.drawImage(с.картинка, x - с.ш * к / 2, y - с.в * к / 2, с.ш * к, с.в * к);
    return;
  }
  const цвет = ЦВЕТА_ИКОНОК[ключ] || '#7a7a90';
  кт.fillStyle = цвет;
  кт.beginPath(); кт.arc(x, y, размер * 0.42, 0, Math.PI * 2); кт.fill();
  кт.strokeStyle = 'rgba(0,0,0,0.4)'; кт.lineWidth = 2; кт.stroke();
  const б = (ключ || '?').charAt(0).toUpperCase();
  текст(б, x, y, {
    размер: размер * 0.5, выравн: 'center', базовая: 'middle',
    цвет: '#fff', толщинаОбводки: 3
  });
}

function нарисоватьИнтерфейс() {
  const и = ИГРА.игрок;
  const у = ЭКР.uiМасштаб;               // на узком экране всё крупнее
  const поля = 16 * у;
  const шп = Math.min(300 * у, ЭКР.ш * 0.42);

  // hp
  полоска(поля, поля, шп, 20 * у, и.hp / и.максHp, ЦВЕТ.хп, ЦВЕТ.хпФон);
  текст(Math.ceil(и.hp) + ' / ' + и.максHp, поля + шп / 2, поля + 10 * у, {
    размер: 14 * у, выравн: 'center', базовая: 'middle'
  });

  // опыт
  const порог = БАЛАНС.порогУровня(ИГРА.уровень);
  полоска(поля, поля + 26 * у, шп, 11 * у, ИГРА.опыт / порог, ЦВЕТ.опыт, ЦВЕТ.опытФон, 4);
  текст('УР ' + ИГРА.уровень, поля + шп + 10, поля + 24 * у, { размер: 16 * у, цвет: ЦВЕТ.опыт });

  /* На узком экране таймер по центру налезает на полоски, поэтому там
     он уходит вправо и уменьшается, а счётчик убитых встаёт под него. */
  const узкийHUD = ЭКР.ш < 620;
  if (узкийHUD) {
    текст(форматВремени(ИГРА.время), ЭКР.ш - поля, поля - 2, {
      размер: 26 * у, выравн: 'right'
    });
    текст('АНОНОВ: ' + ИГРА.убито, ЭКР.ш - поля, поля + 30 * у, {
      размер: 14 * у, выравн: 'right', цвет: ЦВЕТ.текстТускл
    });
  } else {
    текст(форматВремени(ИГРА.время), ЭКР.ш / 2, поля, { размер: 36 * у, выравн: 'center' });
    текст('АНОНОВ: ' + ИГРА.убито, ЭКР.ш - поля, поля, {
      размер: 16 * у, выравн: 'right', цвет: ЦВЕТ.текстТускл
    });
  }

  // ПРАЙМ активен
  if (и.праймОсталось > 0) {
    текст('ПРАЙМ ' + и.праймОсталось.toFixed(1), ЭКР.ш / 2, поля + 48, {
      размер: 22, выравн: 'center', цвет: ЦВЕТ.золото
    });
  }

  // собранный билд слева внизу
  const ключи = Object.keys(и.апгрейды);
  const размерИконки = 44, шаг = 52;
  let x = поля + размерИконки / 2;
  const y = ЭКР.в - поля - размерИконки / 2;
  for (const ид of ключи) {
    const а = АПГРЕЙДЫ.find(u => u.ид === ид);
    if (!а) continue;
    кт.save();
    кт.fillStyle = 'rgba(16,14,22,0.75)';
    скруглённыйПрямоугольник(x - размерИконки / 2, y - размерИконки / 2, размерИконки, размерИконки, 8);
    кт.fill();
    кт.strokeStyle = 'rgba(220,215,235,0.25)'; кт.lineWidth = 1.5; кт.stroke();
    кт.restore();
    нарисоватьИконку(а.иконка, x, y, размерИконки - 12);
    текст('' + и.апгрейды[ид], x + размерИконки / 2 - 4, y + размерИконки / 2 - 4, {
      размер: 15, выравн: 'right', базовая: 'bottom', цвет: ЦВЕТ.золото
    });
    x += шаг;
  }

  // полоска здоровья босса во всю верхнюю часть экрана
  const босс = ИГРА.босс;
  if (босс && босс.мёртв) ИГРА.босс = null;
  if (босс && !босс.мёртв && ИГРА.враги.indexOf(босс) >= 0) {
    const шп = Math.min(760, ЭКР.ш - 40);
    const x = ЭКР.ш / 2 - шп / 2, y = поля + 68 * у;
    полоска(x, y, шп, 18 * у, босс.hp / босс.максHp, ЦВЕТ.хп, ЦВЕТ.хпФон, 6);
    текст(босс.шаблон.имя, ЭКР.ш / 2, y - 22 * у, {
      размер: 21 * у, выравн: 'center', цвет: ЦВЕТ.хп
    });
    текст(Math.max(0, Math.ceil(босс.hp)) + ' / ' + Math.round(босс.максHp),
          ЭКР.ш / 2, y + 9 * у, { размер: 13 * у, выравн: 'center', базовая: 'middle' });
  }

  // ускорение времени включено
  if (ИГРА.множительВремени !== 1 && !МОБИЛЬНЫЙ) {
    текст('x' + ИГРА.множительВремени + ' УСКОРЕНИЕ (T)', ЭКР.ш - поля, поля + 30 * у, {
      размер: 16, выравн: 'right', цвет: ЦВЕТ.золото
    });
  }

  // Счётчик кадров: включается по F. Нужен, чтобы снять реальные цифры
  // на телефоне — в эмуляторе они ничего не значат.
  if (ИГРА.показыватьFPS) {
    текст(ИГРА.fps + ' fps   врагов ' + ИГРА.враги.length, поля, ЭКР.в - 26 * у, {
      размер: 15 * у, цвет: ЦВЕТ.зелёный
    });
  }

  // --- стрелка к клетке: ник, метры и обратный отсчёт ---
  const кл = ИГРА.клетка;
  if (кл && кл.тает <= 0 && !кл.открыта) {
    const цx = ЭКР.ш / 2, цy = ЭКР.в / 2;
    const эx = кл.x - ИГРА.камера.x, эy = кл.y - ИГРА.камера.y;
    const вКадре = эx > 60 && эx < ЭКР.ш - 60 && эy > 60 && эy < ЭКР.в - 60;
    if (!вКадре) {
      const угол = Math.atan2(эy - цy, эx - цx);
      const радX = ЭКР.ш / 2 - 96, радY = ЭКР.в / 2 - 96;
      const сx = цx + Math.cos(угол) * радX, сy = цy + Math.sin(угол) * радY;

      const доля = зажать(кл.осталось / ИВЕНТ.времяНаСпасение, 0, 1);
      // чем меньше остаётся, тем краснее и быстрее пульсация
      const частота = 3 + (1 - доля) * 12;
      const пульс = 0.55 + Math.abs(Math.sin(ИГРА.времяВсего * частота)) * 0.45;
      const цвет = доля > 0.5 ? '#8fd6ff' : (доля > 0.25 ? '#ffcc44' : '#ff5a5a');
      const метры = Math.round(дистанция(кл.x, кл.y, ИГРА.игрок.x, ИГРА.игрок.y) / 32);

      кт.save();
      кт.globalAlpha = пульс;
      кт.translate(сx, сy);
      кт.rotate(угол);
      кт.fillStyle = цвет;
      кт.beginPath();
      кт.moveTo(26, 0); кт.lineTo(-14, -17); кт.lineTo(-6, 0); кт.lineTo(-14, 17);
      кт.closePath(); кт.fill();
      кт.restore();

      // табличка с цифрами: игрок решает бежать или нет именно по ним
      const ник = кл.донатер.ник;
      const строка2 = метры + ' м   ' + Math.ceil(кл.осталось) + ' сек';
      const рН = 17 * у, рС = 16 * у;
      const шп = Math.max(ширинаТекста(ник, рН), ширинаТекста(строка2, рС, '700')) + 22;
      const пx = зажать(сx, шп / 2 + 8, ЭКР.ш - шп / 2 - 8);
      const пy = зажать(сy + (Math.sin(угол) > 0 ? -60 : 40), 40, ЭКР.в - 70);
      кт.save();
      кт.globalAlpha = 0.9;
      кт.fillStyle = 'rgba(16,14,22,0.85)';
      const вп = 30 * у + рС;
      скруглённыйПрямоугольник(пx - шп / 2, пy - 6, шп, вп, 8); кт.fill();
      кт.strokeStyle = цвет; кт.lineWidth = 2;
      скруглённыйПрямоугольник(пx - шп / 2, пy - 6, шп, вп, 8); кт.stroke();
      кт.restore();
      текст(ник, пx, пy, { размер: рН, выравн: 'center', цвет: '#f2f0f6' });
      текст(строка2, пx, пy + рН + 6, { размер: рС, вес: '700', выравн: 'center', цвет: цвет });
    }
  }

  // --- список спасённых с иконками бонусов ---
  if (ИГРА.спасённые.length) {
    // если сверху висит полоска босса, список уходит под неё
    const боссНаЭкране = босс && !босс.мёртв && ИГРА.враги.indexOf(босс) >= 0;
    let y = поля + (узкийHUD ? 56 * у : 58) + (боссНаЭкране ? 56 * у : 0);
    const рн = 15 * у;
    текст('СПАСЕНЫ', ЭКР.ш - поля, y, { размер: 13 * у, выравн: 'right', цвет: ЦВЕТ.текстТускл });
    y += 22 * у;
    for (const с of ИГРА.спасённые) {
      const шн = ширинаТекста(с.ник, рн);
      нарисоватьИконку(с.иконка, ЭКР.ш - поля - шн - 20 * у, y + 7 * у, 24 * у);
      текст(с.ник, ЭКР.ш - поля, y, { размер: рн, выравн: 'right', цвет: ЦВЕТ.зелёный });
      y += 27 * у;
    }
  }

  // призрачный режим
  if (ИГРА.игрок.призрак > 0) {
    текст('ПРИЗРАК ' + ИГРА.игрок.призрак.toFixed(1), поля, поля + 52, {
      размер: 20, цвет: '#b98ce0'
    });
  }

  // подсказка на первых секундах
  if (ИГРА.время < 7) {
    кт.globalAlpha = зажать((7 - ИГРА.время) / 2.5, 0, 1);
    const подсказка = МОБИЛЬНЫЙ
      ? 'ВЕДИ ПАЛЬЦЕМ. ГАНТЕЛЯ САМА.'
      : 'WASD ИЛИ СТРЕЛКИ. ГАНТЕЛЯ ЛЕТИТ САМА.';
    let рП = 22 * (МОБИЛЬНЫЙ ? у : 1);
    while (ширинаТекста(подсказка, рП) > ЭКР.ш - 40 && рП > 11) рП -= 1;
    текст(подсказка, ЭКР.ш / 2, ЭКР.в - 70, {
      размер: рП, выравн: 'center', цвет: ЦВЕТ.текстТускл
    });
    кт.globalAlpha = 1;
  }
}


/* ==========================================================================
   БЛОК 17. ЭКРАНЫ
   ========================================================================== */

let кнопки = [];

function кнопка(подпись, x, y, ш, в, действие) {
  const наведена = мышь.x >= x && мышь.x <= x + ш && мышь.y >= y && мышь.y <= y + в;
  кт.save();
  кт.fillStyle = наведена ? '#3c4f86' : '#232130';
  скруглённыйПрямоугольник(x, y, ш, в, 10); кт.fill();
  кт.strokeStyle = наведена ? '#8fb6ff' : '#585570'; кт.lineWidth = 2.5;
  скруглённыйПрямоугольник(x, y, ш, в, 10); кт.stroke();
  кт.restore();
  текст(подпись, x + ш / 2, y + в / 2, { размер: 26, выравн: 'center', базовая: 'middle' });
  кнопки.push({ x, y, ш, в, действие });
}

function затемнение(альфа) {
  кт.fillStyle = 'rgba(12,10,16,' + альфа + ')';
  кт.fillRect(0, 0, ЭКР.ш, ЭКР.в);
}

function экранЗагрузки() {
  кт.fillStyle = '#1a1820';
  кт.fillRect(0, 0, ЭКР.ш, ЭКР.в);
  текст('ЗАГРУЗКА', ЭКР.ш / 2, ЭКР.в / 2 - 40, { размер: 34, выравн: 'center' });
  const ш = Math.min(420, ЭКР.ш * 0.6);
  полоска(ЭКР.ш / 2 - ш / 2, ЭКР.в / 2 + 10, ш, 14,
          всегоЗагрузить ? загружено / всегоЗагрузить : 0, ЦВЕТ.опыт, ЦВЕТ.опытФон, 5);
}

function экранСтарта() {
  кнопки = [];
  кт.fillStyle = ЦВЕТ.пол;
  кт.fillRect(0, 0, ЭКР.ш, ЭКР.в);
  нарисоватьПол(120, 80);
  затемнение(0.45);

  const цx = ЭКР.ш / 2;
  текст('СУСЛОВ', цx, ЭКР.в * 0.18, { размер: Math.min(96, ЭКР.ш * 0.13), выравн: 'center' });
  текст('ВЫЖИВАЧ', цx, ЭКР.в * 0.18 + Math.min(96, ЭКР.ш * 0.13) * 0.95, {
    размер: Math.min(58, ЭКР.ш * 0.08), выравн: 'center', цвет: ЦВЕТ.зелёный
  });
  текст('продержись 10 минут, друк', цx, ЭКР.в * 0.44, {
    размер: 22, выравн: 'center', цвет: ЦВЕТ.текстТускл
  });

  // Илья дышит на месте
  drawSprite('ilya_idle', цx, ЭКР.в * 0.70, { фаза: 0, идёт: false, сторона: 1 });

  текст('НИК', цx, ЭКР.в * 0.82 - 84, { размер: 15, выравн: 'center', цвет: ЦВЕТ.текстТускл });
  кнопка('ПОДРУБ', цx - 130, ЭКР.в * 0.82, 260, 62, начатьЗабег);
  if (!МОБИЛЬНЫЙ) {
    текст('ENTER ИЛИ ПРОБЕЛ', цx, ЭКР.в * 0.82 + 76, {
      размер: 16, выравн: 'center', цвет: ЦВЕТ.текстТускл
    });
  }
  if (ИГРА.рекорд > 0) {
    текст('РЕКОРД: ' + форматВремени(ИГРА.рекорд), цx, ЭКР.в * 0.5, {
      размер: 24, выравн: 'center', цвет: ЦВЕТ.золото
    });
  }
  if (ошибкиЗагрузки.length > 0) {
    текст('не нашлись спрайты (' + ошибкиЗагрузки.length + ') — играем на заглушках',
          цx, ЭКР.в - 34, { размер: 15, выравн: 'center', цвет: '#d88' });
  }
  текст('этап 3', 16, ЭКР.в - 30, { размер: 15, цвет: '#4a4658' });
}

function экранЛевелапа() {
  кнопки = [];
  нарисоватьМир();
  нарисоватьИнтерфейс();
  затемнение(0.72);

  текст('УРОВЕНЬ ' + ИГРА.уровень, ЭКР.ш / 2, ЭКР.в * 0.13, {
    размер: 46, выравн: 'center', цвет: ЦВЕТ.золото
  });
  текст('думай', ЭКР.ш / 2, ЭКР.в * 0.13 + 56, {
    размер: 20, выравн: 'center', цвет: ЦВЕТ.текстТускл
  });

  const всего = ИГРА.карточки.length;
  /* В портретной ориентации три колонки дают по 78 px ширины — карточки
     превращаются в нечитаемые полоски. Поэтому на узком экране раскладываем
     их вертикально, во всю ширину, с высотой заведомо больше 48 px. */
  const столбиком = ЭКР.ш < 620;
  const промежуток = столбиком ? 12 : 24;
  const шК = столбиком ? ЭКР.ш - 40 : Math.min(300, (ЭКР.ш - 80) / всего - 20);
  const доступно = ЭКР.в - ЭКР.в * 0.13 - 150;
  const вК = столбиком
    ? Math.max(72, Math.min(140, доступно / всего - промежуток))
    : Math.min(400, ЭКР.в * 0.52);
  const общаяШ = столбиком ? шК : всего * шК + (всего - 1) * промежуток;
  const старт = ЭКР.ш / 2 - общаяШ / 2;
  const общаяВ = столбиком ? всего * вК + (всего - 1) * промежуток : вК;
  const yК = столбиком ? ЭКР.в / 2 - общаяВ / 2 + 30 : ЭКР.в / 2 - вК / 2 + 40;

  for (let i = 0; i < всего; i++) {
    const карта = ИГРА.карточки[i];
    const а = карта.апгрейд;
    const x = столбиком ? старт : старт + i * (шК + промежуток);
    const yЭ = столбиком ? yК + i * (вК + промежуток) : yК;
    const наведена = мышь.x >= x && мышь.x <= x + шК && мышь.y >= yЭ && мышь.y <= yЭ + вК;

    кт.save();
    кт.fillStyle = наведена ? '#2e2b3e' : '#201e2b';
    скруглённыйПрямоугольник(x, yЭ, шК, вК, 16); кт.fill();
    кт.strokeStyle = а.редкая ? ЦВЕТ.золото : (наведена ? '#9fb8ff' : '#4e4b62');
    кт.lineWidth = а.редкая ? 3.5 : 2.5;
    скруглённыйПрямоугольник(x, yЭ, шК, вК, 16); кт.stroke();
    кт.restore();

    // номер для выбора с клавиатуры
    текст(String(i + 1), x + 14, yЭ + 10, { размер: 22, цвет: ЦВЕТ.текстТускл });

    if (столбиком) {
      // компактная строка: иконка слева, название и описание справа
      нарисоватьИконку(а.иконка, x + 46, yЭ + вК / 2, Math.min(56, вК - 18));
      let рИ = 21;
      while (ширинаТекста(а.имя, рИ) > шК - 110 && рИ > 13) рИ -= 1;
      текст(а.имя, x + 86, yЭ + вК / 2 - 20, { размер: рИ });
      const оп = а.описания[карта.новыйУровень - 1] || '';
      let рО = 15;
      while (ширинаТекста(оп, рО, '600') > шК - 110 && рО > 11) рО -= 1;
      текст(оп, x + 86, yЭ + вК / 2 + 4, { размер: рО, вес: '600', цвет: '#cfc9dd' });
      текст('УР ' + карта.новыйУровень + '/' + а.макс, x + шК - 14, yЭ + вК / 2 - 20, {
        размер: 14, выравн: 'right', цвет: а.редкая ? ЦВЕТ.золото : ЦВЕТ.текстТускл
      });
      кнопки.push({ x, y: yЭ, ш: шК, в: вК, действие: () => взятьКарточку(i) });
      continue;
    }

    нарисоватьИконку(а.иконка, x + шК / 2, yЭ + 96, 92);

    // название, при необходимости в две строки
    const слова = а.имя.split(' ');
    let размерИмени = 26;
    while (ширинаТекста(а.имя, размерИмени) > шК - 30 && размерИмени > 15) размерИмени -= 1;
    if (слова.length > 1 && ширинаТекста(а.имя, 26) > шК - 30) {
      текст(слова[0], x + шК / 2, yЭ + 170, { размер: 24, выравн: 'center' });
      текст(слова.slice(1).join(' '), x + шК / 2, yЭ + 198, { размер: 24, выравн: 'center' });
    } else {
      текст(а.имя, x + шК / 2, yЭ + 178, { размер: размерИмени, выравн: 'center' });
    }

    текст('УРОВЕНЬ ' + карта.новыйУровень + ' / ' + а.макс, x + шК / 2, yЭ + 232, {
      размер: 15, выравн: 'center', цвет: а.редкая ? ЦВЕТ.золото : ЦВЕТ.текстТускл
    });

    // описание с переносом по словам
    const описание = а.описания[карта.новыйУровень - 1] || '';
    const строки = [];
    let текущая = '';
    for (const слово of описание.split(' ')) {
      const проба = текущая ? текущая + ' ' + слово : слово;
      if (ширинаТекста(проба, 17, '600') > шК - 40 && текущая) { строки.push(текущая); текущая = слово; }
      else текущая = проба;
    }
    if (текущая) строки.push(текущая);
    for (let с = 0; с < строки.length; с++) {
      текст(строки[с], x + шК / 2, yЭ + 270 + с * 24, {
        размер: 17, вес: '600', выравн: 'center', цвет: '#cfc9dd'
      });
    }

    кнопки.push({ x, y: yЭ, ш: шК, в: вК, действие: () => взятьКарточку(i) });
  }

  if (!МОБИЛЬНЫЙ) {
    текст('1 / 2 / 3 ИЛИ МЫШЬ', ЭКР.ш / 2, yК + общаяВ + 26, {
      размер: 17, выравн: 'center', цвет: ЦВЕТ.текстТускл
    });
  }
}

/* Экран замены: взял четвёртого пацана — кого-то надо отпустить.
   Трое это отряд и осмысленный выбор связки, пятеро — каша и автобой. */
function экранЗамены() {
  кнопки = [];
  нарисоватьМир();
  нарисоватьИнтерфейс();
  затемнение(0.75);

  const новыйК = СОЮЗНИКИ[ИГРА.заменаНа];
  текст('В ОТРЯДЕ ТРОЕ', ЭКР.ш / 2, ЭКР.в * 0.12, {
    размер: 40, выравн: 'center', цвет: ЦВЕТ.золото
  });
  текст('кого отпустить ради ' + (новыйК ? новыйК.ник : '?') + '?', ЭКР.ш / 2, ЭКР.в * 0.12 + 52, {
    размер: 20, выравн: 'center', цвет: ЦВЕТ.текстТускл
  });

  const всего = ИГРА.союзники.length;
  const шК = Math.min(280, (ЭКР.ш - 100) / всего - 20);
  const вК = Math.min(340, ЭКР.в * 0.44);
  const промежуток = 24;
  const общая = всего * шК + (всего - 1) * промежуток;
  const старт = ЭКР.ш / 2 - общая / 2;
  const yК = ЭКР.в / 2 - вК / 2 + 30;

  for (let i = 0; i < всего; i++) {
    const с = ИГРА.союзники[i];
    const x = старт + i * (шК + промежуток);
    const наведена = мышь.x >= x && мышь.x <= x + шК && мышь.y >= yК && мышь.y <= yК + вК;
    кт.save();
    кт.fillStyle = наведена ? '#3a2b2e' : '#241f28';
    скруглённыйПрямоугольник(x, yК, шК, вК, 16); кт.fill();
    кт.strokeStyle = наведена ? '#e07a7a' : '#4e4b62';
    кт.lineWidth = наведена ? 3.5 : 2.5;
    скруглённыйПрямоугольник(x, yК, шК, вК, 16); кт.stroke();
    кт.restore();

    текст(String(i + 1), x + 18, yК + 14, { размер: 24, цвет: ЦВЕТ.текстТускл });
    нарисоватьИконку(с.конфиг.спрайт, x + шК / 2, yК + 92, 96);
    текст(с.конфиг.ник, x + шК / 2, yК + 158, { размер: 24, выравн: 'center' });
    текст('УРОВЕНЬ ' + с.уровень, x + шК / 2, yК + 192, {
      размер: 15, выравн: 'center', цвет: ЦВЕТ.текстТускл
    });
    текст('ОТПУСТИТЬ', x + шК / 2, yК + вК - 42, {
      размер: 18, выравн: 'center', цвет: '#e08a8a'
    });
    кнопки.push({ x, y: yК, ш: шК, в: вК, действие: () => заменитьСоюзника(i) });
  }

  кнопка('ОСТАВИТЬ КАК ЕСТЬ', ЭКР.ш / 2 - 150, yК + вК + 26, 300, 48, () => заменитьСоюзника(-1));
  if (!МОБИЛЬНЫЙ) {
    текст('1 / 2 / 3 ИЛИ МЫШЬ', ЭКР.ш / 2, yК + вК + 88, {
      размер: 16, выравн: 'center', цвет: ЦВЕТ.текстТускл
    });
  }
}

function экранИтогов() {
  кнопки = [];
  нарисоватьМир();
  затемнение(0.85);

  const у = ЭКР.uiМасштаб;
  const узкий = ЭКР.ш < 900;
  const цx = ЭКР.ш / 2;
  текст('ИТОГИ', цx, ЭКР.в * 0.05, { размер: 54 * у, выравн: 'center', цвет: ЦВЕТ.хп });

  // На широком экране две колонки: слева забег, справа топ-10.
  // На узком (телефон) — только забег и короткий топ снизу.
  const колонкаШ = узкий ? ЭКР.ш - 48 : 420;
  const левый = узкий ? 24 : цx - колонкаШ - 30;
  const правый = левый + колонкаШ;

  let y = ЭКР.в * 0.16;
  const строка = (подпись, значение, цвет) => {
    текст(подпись, левый, y, { размер: 20 * у, цвет: ЦВЕТ.текстТускл });
    текст(значение, правый, y, { размер: 22 * у, выравн: 'right', цвет: цвет || ЦВЕТ.текст });
    y += 36 * у;
  };
  строка('ПРОЖИЛ', форматВремени(ИГРА.время));
  строка('УРОВЕНЬ', String(ИГРА.уровень));
  строка('УБИТО АНОНОВ', String(ИГРА.убито));
  строка('СПАСЕНО', String(ИГРА.спасённые.length));
  строка('РЕКОРД', форматВремени(ИГРА.рекорд), ЦВЕТ.золото);

  if (ИГРА.новыйРекорд) {
    let рР = 21 * у;
    while (ширинаТекста('НОВЫЙ РЕКОРД, ЗДРАВО', рР) > колонкаШ && рР > 12) рР -= 1;
    текст('НОВЫЙ РЕКОРД, ЗДРАВО', левый, y, { размер: рР, цвет: ЦВЕТ.зелёный });
    y += 30 * у;
  }
  y += 8;

  // собранный билд иконками — то, ради чего скриншот и постят
  текст('БИЛД', левый, y, { размер: 17 * у, цвет: ЦВЕТ.текстТускл });
  y += 28 * у;
  const ключи = Object.keys(ИГРА.игрок.апгрейды);
  if (ключи.length === 0) {
    текст('только гантеля. без треша', левый, y, { размер: 17 * у, цвет: '#8a8598' });
    y += 30 * у;
  } else {
    const размер = 44 * у, шаг = 52 * у;
    let x = левый + размер / 2;
    for (const ид of ключи) {
      const а = АПГРЕЙДЫ.find(u => u.ид === ид);
      if (!а) continue;
      if (x + размер / 2 > правый) { x = левый + размер / 2; y += шаг; }
      кт.save();
      кт.fillStyle = 'rgba(30,27,40,0.9)';
      скруглённыйПрямоугольник(x - размер / 2, y, размер, размер, 9);
      кт.fill();
      кт.strokeStyle = 'rgba(220,215,235,0.25)'; кт.lineWidth = 1.5; кт.stroke();
      кт.restore();
      нарисоватьИконку(а.иконка, x, y + размер / 2, размер - 12);
      текст('' + ИГРА.игрок.апгрейды[ид], x + размер / 2 - 4, y + размер - 3, {
        размер: 14 * у, выравн: 'right', базовая: 'bottom', цвет: ЦВЕТ.золото
      });
      x += шаг;
    }
    y += размер + 12;
  }

  // На телефоне список ников не дублируем: их число уже есть строкой СПАСЕНО,
  // а место нужнее таблице рекордов.
  if (ИГРА.спасённые.length && !узкий) {
    текст('СПАСЕНЫ', левый, y, { размер: 17 * у, цвет: ЦВЕТ.текстТускл });
    y += 28 * у;
    let x = левый;
    for (const с of ИГРА.спасённые) {
      нарисоватьИконку(с.иконка, x + 12 * у, y + 8 * у, 24 * у);
      текст(с.ник, x + 28 * у, y, { размер: 16 * у, цвет: ЦВЕТ.зелёный });
      x += 34 * у + ширинаТекста(с.ник, 16 * у);
      if (x > правый - 60) { x = левый; y += 28 * у; }
    }
    y += 10;
  }

  нарисоватьТаблицу(узкий, цx, левый, колонкаШ, у, y + 18 * у);

  const шК = 260 * у, вК = Math.max(56, 60 * у);
  кнопка('ЕЩЁ РАЗ', цx - шК / 2, ЭКР.в - вК - 96, шК, вК, начатьЗабег);
  if (!МОБИЛЬНЫЙ) {
    текст('ENTER ИЛИ R', цx, ЭКР.в - 98, { размер: 16, выравн: 'center', цвет: ЦВЕТ.текстТускл });
  }
}

/* Локальный топ-10 по этому устройству. Пишется через отправитьРезультат —
   единственную точку входа, куда позже встанет внешний сервер рейтингов. */
function нарисоватьТаблицу(узкий, цx, левыйСтолбец, колонкаШ, у, yПотока) {
  const таблица = ИГРА.таблица.length ? ИГРА.таблица : прочитатьТаблицу();
  if (!таблица.length) return;

  const шаг0 = 26 * у;
  const ш = узкий ? колонкаШ : 420;
  const x = узкий ? левыйСтолбец : цx + 30;
  let y = узкий ? yПотока : ЭКР.в * 0.16;

  // на узком экране показываем столько строк, сколько влезает над кнопкой
  const низДоступный = ЭКР.в - 96 - Math.max(56, 60 * у) - 16;
  let шаг = шаг0;
  let строк;
  if (узкий) {
    const место = низДоступный - y - 28 * у;
    строк = Math.min(5, таблица.length, Math.max(0, Math.floor(место / шаг)));
    // не влезает даже тройка — ужимаем строку, но таблицу показываем
    if (строк < Math.min(3, таблица.length) && место > 40) {
      строк = Math.min(3, таблица.length);
      шаг = Math.max(17, место / строк);
    }
  } else {
    строк = Math.min(10, таблица.length);
  }
  if (строк <= 0) return;

  текст(узкий ? 'ТОП' : 'ТОП-10 НА ЭТОМ УСТРОЙСТВЕ', x, y, {
    размер: 17 * у, цвет: ЦВЕТ.текстТускл
  });
  y += 28 * у;

  for (let i = 0; i < строк; i++) {
    const р = таблица[i];
    const этот = i === ИГРА.местоВТаблице;
    if (этот) {
      кт.save();
      кт.fillStyle = 'rgba(90,120,200,0.28)';
      скруглённыйПрямоугольник(x - 8, y - 3, ш + 16, шаг, 5);
      кт.fill(); кт.restore();
    }
    const цвет = этот ? '#ffffff' : (i === 0 ? ЦВЕТ.золото : ЦВЕТ.текстТускл);
    const размер = Math.min(16 * у, шаг - 6);
    текст((i + 1) + '.', x, y, { размер, цвет });
    текст(р.ник, x + 30 * у, y, { размер, цвет });
    текст(форматВремени(р.время), x + ш * 0.58, y, { размер, цвет, выравн: 'right' });
    текст('ур ' + р.уровень, x + ш * 0.78, y, { размер, цвет, выравн: 'right' });
    текст('спас ' + (р.спасённых || 0), x + ш, y, { размер, цвет, выравн: 'right' });
    y += шаг;
  }
}

/* Ссылка на автора — обычный HTML поверх канваса, иначе по ней нельзя кликнуть.
   Видна только на ПОДРУБ и ИТОГАХ; в бою скрыта, чтобы не перехватывала клики. */
const ссылкаОтзыва = document.getElementById('fb');
function обновитьСсылку() {
  let низ = null;
  if (ИГРА.экран === 'старт')      низ = Math.round(ЭКР.в * 0.82) + 96;
  else if (ИГРА.экран === 'итоги') низ = ЭКР.в - 64;
  if (низ === null) {
    if (ссылкаОтзыва.style.display !== 'none') ссылкаОтзыва.style.display = 'none';
  } else {
    if (ссылкаОтзыва.style.display !== 'block') ссылкаОтзыва.style.display = 'block';
    ссылкаОтзыва.style.top = низ + 'px';
  }

  // поле ника живёт только на стартовом экране
  if (ИГРА.экран === 'старт') {
    if (полеНика.style.display !== 'block') полеНика.style.display = 'block';
    полеНика.style.top = Math.round(ЭКР.в * 0.82) - 62 + 'px';
  } else if (полеНика.style.display !== 'none') {
    полеНика.blur();
    полеНика.style.display = 'none';
  }
}

/* Момент спасения: вспышка экрана и крупный ник, взлетающий вверх.
   Это тот кадр, который постят в чат, поэтому он рисуется поверх всего. */
function нарисоватьСпасение() {
  if (ИГРА.вспышкаЭкрана > 0) {
    кт.fillStyle = 'rgba(255,255,255,' + зажать(ИГРА.вспышкаЭкрана * 0.55, 0, 0.55) + ')';
    кт.fillRect(0, 0, ЭКР.ш, ЭКР.в);
  }
  const н = ИГРА.взлетающийНик;
  if (н) {
    const доля = н.жизнь / н.всего;
    кт.save();
    кт.globalAlpha = зажать(доля * 1.4, 0, 1);
    const размер = (н.топ ? 76 : 56) * (1.25 - доля * 0.25);
    текст(н.текст, н.x - ИГРА.камера.x, н.y - ИГРА.камера.y, {
      размер, выравн: 'center', базовая: 'middle',
      цвет: н.топ ? ЦВЕТ.золото : ЦВЕТ.зелёный
    });
    текст('СПАСЁН', н.x - ИГРА.камера.x, н.y - ИГРА.камера.y + размер * 0.75, {
      размер: размер * 0.34, выравн: 'center', базовая: 'middle', цвет: '#f2f0f6'
    });
    кт.restore();
  }
}

function нарисоватьДжойстик() {
  if (!джойстик.активен) return;
  кт.save();
  кт.globalAlpha = 0.28;
  кт.strokeStyle = '#eef3ff'; кт.lineWidth = 3;
  кт.beginPath(); кт.arc(джойстик.базаX, джойстик.базаY, джойстик.радиус, 0, ДВА_ПИ); кт.stroke();
  кт.globalAlpha = 0.12;
  кт.fillStyle = '#eef3ff'; кт.fill();

  const дx = джойстик.x - джойстик.базаX, дy = джойстик.y - джойстик.базаY;
  const д = Math.min(Math.hypot(дx, дy), джойстик.радиус) || 0;
  const у = Math.atan2(дy, дx);
  кт.globalAlpha = 0.55;
  кт.fillStyle = '#eef3ff';
  кт.beginPath();
  кт.arc(джойстик.базаX + Math.cos(у) * д, джойстик.базаY + Math.sin(у) * д, 30, 0, ДВА_ПИ);
  кт.fill();
  кт.restore();
}

function нажатие(код) {
  разбудитьЗвук();
  // Ускорение x4: без него проверка поздних волн съедает по десять минут за прогон.
  if (код === 'KeyF') { ИГРА.показыватьFPS = !ИГРА.показыватьFPS; return; }
  if (код === 'KeyT') {
    ИГРА.множительВремени = ИГРА.множительВремени === 1 ? 4 : 1;
    return;
  }
  if (ИГРА.экран === 'старт' && (код === 'Enter' || код === 'Space')) начатьЗабег();
  else if (ИГРА.экран === 'итоги' && (код === 'Enter' || код === 'KeyR')) начатьЗабег();
  else if (ИГРА.экран === 'левелап') {
    if (код === 'Digit1' || код === 'Numpad1') взятьКарточку(0);
    if (код === 'Digit2' || код === 'Numpad2') взятьКарточку(1);
    if (код === 'Digit3' || код === 'Numpad3') взятьКарточку(2);
  }
  else if (ИГРА.экран === 'замена') {
    if (код === 'Digit1' || код === 'Numpad1') заменитьСоюзника(0);
    if (код === 'Digit2' || код === 'Numpad2') заменитьСоюзника(1);
    if (код === 'Digit3' || код === 'Numpad3') заменитьСоюзника(2);
    if (код === 'Escape') заменитьСоюзника(-1);
  }
}

function обработатьКлик() {
  if (!мышь.клик) return;
  мышь.клик = false;
  for (const к of кнопки) {
    if (мышь.x >= к.x && мышь.x <= к.x + к.ш && мышь.y >= к.y && мышь.y <= к.y + к.в) {
      к.действие(); return;
    }
  }
}


/* ==========================================================================
   БЛОК 18. ГЛАВНЫЙ ЦИКЛ
   Фиксированный шаг 1/60 — на 144 Гц игра не ускоряется.
   ========================================================================== */

const ШАГ = 1 / 60;
let накопитель = 0, прошлое = performance.now();
ИГРА.времяВсего = 0;

function шагЛогики(дт) {
  ИГРА.времяВсего += дт;
  if (ИГРА.экран !== 'бой') return;
  ИГРА.время += дт;
  обновитьИгрока(дт);
  обновитьСпавн(дт);
  обновитьВрагов(дт);
  обновитьОружие(дт);
  обновитьГантели(дт);
  обновитьСвиту(дт);
  обновитьРасписаниеИвентов(дт);
  обновитьКлетку(дт);
  обновитьУбегающих(дт);
  обновитьПризрака(дт);
  обновитьПредметы(дт);
  обновитьКольца(дт);
  обновитьКуски(дт);
  обновитьКристаллы(дт);
  обновитьЭффекты(дт);
  обновитьКамеру(дт);
}

let кадровВОкне = 0, окноНачало = 0;

function кадр(сейчас) {
  requestAnimationFrame(кадр);

  кадровВОкне++;
  if (сейчас - окноНачало >= 500) {
    ИГРА.fps = Math.round(кадровВОкне * 1000 / (сейчас - окноНачало));
    кадровВОкне = 0; окноНачало = сейчас;
  }
  let дельта = (сейчас - прошлое) / 1000;
  прошлое = сейчас;
  if (дельта > 0.25) дельта = 0.25;
  // короткое замедление в момент спасения
  let темп = ИГРА.множительВремени;
  if (ИГРА.замедление > 0) { ИГРА.замедление -= дельта; темп *= 0.25; }
  накопитель += дельта * темп;
  const пределШагов = 8 * ИГРА.множительВремени;
  void темп;
  let защита = 0;
  while (накопитель >= ШАГ && защита < пределШагов) { шагЛогики(ШАГ); накопитель -= ШАГ; защита++; }

  кт.imageSmoothingEnabled = true;
  if (ИГРА.экран === 'загрузка')      экранЗагрузки();
  else if (ИГРА.экран === 'старт')    экранСтарта();
  else if (ИГРА.экран === 'левелап')  экранЛевелапа();
  else if (ИГРА.экран === 'замена')   экранЗамены();
  else if (ИГРА.экран === 'итоги')    экранИтогов();
  else { нарисоватьМир(); нарисоватьИнтерфейс(); нарисоватьСпасение(); нарисоватьДжойстик(); кнопки = []; }
  обновитьСсылку();
  обработатьКлик();
}

загрузитьСпрайты(() => {
  прогретьПозы();               // печём все позы заранее, чтобы не подтормаживало в бою
  ИГРА.экран = 'старт';
});
requestAnimationFrame(кадр);
</script>
